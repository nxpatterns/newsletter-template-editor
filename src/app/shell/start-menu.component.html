<div class="file-menu" #root data-testid="start-menu">
  <button
    type="button"
    class="file-menu-trigger"
    data-testid="start-menu-trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="i18n.t('file.menu')"
    [attr.title]="i18n.t('file.menu')"
    (click)="toggleMenu($event)"
  >
    <svg class="file-menu-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
      <path d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z" />
    </svg>
  </button>

  @if (open()) {
    <div class="file-menu-panel" role="menu" data-testid="start-menu-panel">
      <div class="file-menu-head">
        <span class="file-menu-eyebrow" [textContent]="i18n.t('startMenu.eyebrow')"></span>
        <b class="file-menu-head-title" [textContent]="i18n.t('startMenu.headTitle')"></b>
      </div>
      <div class="file-menu-body">
        <div class="file-menu-section-label" [textContent]="i18n.t('start.newSection')"></div>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="start-menu-blank" (click)="startNew('blank')">
          <span class="file-menu-tile"><app-menu-icon name="blank" /></span>
          <span class="file-menu-text">
            <span [textContent]="i18n.t('start.blank')"></span>
            <span class="file-menu-hint" [textContent]="i18n.t('start.blankHint')"></span>
          </span>
        </button>
        @if (showDemoDe()) {
          <button type="button" class="file-menu-item" role="menuitem" data-testid="start-menu-demo-de" (click)="startNew('demo', 'de')">
            <span class="file-menu-tile"><app-flag code="de" /></span>
            <span class="file-menu-text">
              <span [textContent]="i18n.t('start.demoDe')"></span>
              <span class="file-menu-hint" [textContent]="i18n.t('start.demoDeCountries')"></span>
            </span>
          </button>
        }
        @if (showDemoEn()) {
          <button type="button" class="file-menu-item" role="menuitem" data-testid="start-menu-demo-en" (click)="startNew('demo', 'en')">
            <span class="file-menu-tile"><app-flag code="uk" /></span>
            <span class="file-menu-text">
              <span [textContent]="i18n.t('start.demoEn')"></span>
              <span class="file-menu-hint" [textContent]="i18n.t('start.demoEnCountries')"></span>
            </span>
          </button>
        }

        <div class="file-menu-section-label" [textContent]="i18n.t('startMenu.sectionSaved')"></div>
        <button
          type="button"
          class="file-menu-item"
          role="menuitem"
          data-testid="start-menu-open-saved"
          [disabled]="!hasSaved()"
          (click)="openLibrary()"
        >
          <span class="file-menu-tile"><app-menu-icon name="folder" /></span>
          <span class="file-menu-text">
            <span [textContent]="i18n.t('file.openLibrary')"></span>
            @if (!hasSaved()) {
              <span class="file-menu-hint" [textContent]="i18n.t('startMenu.noSaved')"></span>
            }
          </span>
        </button>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="start-menu-open-file" (click)="openFile()">
          <span class="file-menu-tile"><app-menu-icon name="upload" /></span>
          <span class="file-menu-text">
            <span [textContent]="i18n.t('startMenu.openFile')"></span>
            <span class="file-menu-hint" [textContent]="i18n.t('startMenu.openFileHint')"></span>
          </span>
        </button>

        <div class="file-menu-danger">
          <button type="button" class="file-menu-item file-menu-item--danger" role="menuitem" data-testid="menu-factory-reset" (click)="factoryReset()">
            <span class="file-menu-tile"><app-menu-icon name="reset" /></span>
            <span [textContent]="i18n.t('reset.menuItem')"></span>
          </button>
        </div>
      </div>
    </div>
  }
</div>

<app-library-picker
  [open]="libraryOpen()"
  [rows]="libraryRows()"
  (closed)="libraryOpen.set(false)"
  (picked)="pickLibrary($event)"
  (deleted)="removeLibrary($event)"
/>
