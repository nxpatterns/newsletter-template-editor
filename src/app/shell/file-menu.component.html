<button
  type="button"
  class="header-btn header-btn--primary"
  data-testid="file-save"
  [disabled]="!canSave()"
  [attr.title]="i18n.t('action.save') + ' (' + saveShortcut + ')'"
  (click)="save()"
>
  <svg class="header-btn-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
    <path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM480-240q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35ZM240-560h360v-160H240v160Z" />
  </svg>
  <span [textContent]="i18n.t('action.save')"></span>
  @if (canSave()) {
    <kbd class="header-btn-kbd" [textContent]="saveShortcut"></kbd>
  }
</button>
<button
  type="button"
  class="header-btn header-btn--outline"
  data-testid="file-export"
  (click)="showExport()"
>
  <svg class="header-btn-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
    <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
  </svg>
  <span [textContent]="i18n.t('file.exportButton')"></span>
</button>

<div class="file-menu" #root data-testid="file-menu">
  <button
    type="button"
    class="file-menu-trigger"
    data-testid="file-menu-trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="i18n.t('file.menu')"
    [attr.title]="i18n.t('file.menu')"
    (click)="toggleMenu($event)"
  >
    <svg class="file-menu-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
      <path d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z" />
    </svg>
  </button>

  @if (open()) {
    <div class="file-menu-panel" role="menu" data-testid="file-menu-panel">
      <div class="file-menu-head">
        <span class="file-menu-eyebrow" [textContent]="i18n.t('file.sectionCurrent')"></span>
        <b class="file-menu-head-title file-menu-head-title--file" data-testid="file-menu-doc-name" [textContent]="session.displayName()"></b>
        @if (session.dirty()) {
          <span class="file-menu-state file-menu-state--dirty" [textContent]="i18n.t('file.statusUnsaved')"></span>
        } @else if (session.libraryId()) {
          <span class="file-menu-state file-menu-state--saved">
            <span aria-hidden="true">✓</span>
            <span [textContent]="i18n.t('file.statusSaved')"></span>
          </span>
        }
      </div>
      <div class="file-menu-body">
        <button type="button" class="file-menu-item" role="menuitem" data-testid="file-rename" (click)="rename()">
          <span class="file-menu-tile"><app-menu-icon name="rename" /></span>
          <span [textContent]="i18n.t('file.rename')"></span>
        </button>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="file-save-as" (click)="saveAs()">
          <span class="file-menu-tile"><app-menu-icon name="saveAs" /></span>
          <span [textContent]="i18n.t('file.saveAs')"></span>
          <kbd class="file-menu-kbd" [textContent]="'⇧' + saveShortcut"></kbd>
        </button>

        <div class="file-menu-section-label" [textContent]="i18n.t('file.sectionOther')"></div>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="file-open-library" (click)="openLibrary()">
          <span class="file-menu-tile"><app-menu-icon name="folder" /></span>
          <span [textContent]="i18n.t('file.openLibrary')"></span>
        </button>

        <div class="file-menu-section-label" [textContent]="i18n.t('file.sectionProject')"></div>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="file-download-project" (click)="downloadProject()">
          <span class="file-menu-tile"><app-menu-icon name="download" /></span>
          <span [textContent]="i18n.t('file.downloadProject')"></span>
        </button>
        <button type="button" class="file-menu-item" role="menuitem" data-testid="file-open-project" (click)="openProjectPicker()">
          <span class="file-menu-tile"><app-menu-icon name="upload" /></span>
          <span [textContent]="i18n.t('file.openProject')"></span>
        </button>

        <div class="file-menu-danger">
          <button type="button" class="file-menu-item file-menu-item--danger" role="menuitem" data-testid="menu-factory-reset" (click)="factoryReset()">
            <span class="file-menu-tile"><app-menu-icon name="reset" /></span>
            <span [textContent]="i18n.t('reset.menuItem')"></span>
          </button>
        </div>
      </div>
    </div>
  }

  <input
    #projectInput
    type="file"
    class="file-menu-hidden-input"
    accept="application/json,.json"
    data-testid="file-project-input"
    (change)="onProjectFile($event)"
  />
</div>

<app-library-picker
  [open]="libraryOpen()"
  [rows]="libraryRows()"
  (closed)="closeLibraryPicker()"
  (picked)="pickLibrary($event)"
  (deleted)="removeLibrary($event)"
/>

<app-export-html-dialog
  [open]="exportOpen()"
  (closed)="closeExportDialog()"
  (chosen)="exportHtml($event)"
/>
