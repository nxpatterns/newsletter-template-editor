@let block = session.selectedBlock();

<section class="inspector" data-testid="block-inspector">
  @if (!block) {
    <p class="ed-hint" [textContent]="i18n.t('inspector.empty')"></p>
  } @else {
    <p class="type-label" [textContent]="i18n.t('block.' + block.type)"></p>
    <h3 class="ed-section-title" [textContent]="i18n.t('inspector.properties')"></h3>

    @switch (block.type) {
      @case ('hero') {
        <div class="ed-field">
          <label class="ed-label" for="insp-hero-label" [textContent]="i18n.t('field.label')"></label>
          <input
            id="insp-hero-label"
            class="ed-input"
            data-testid="insp-hero-label"
            [value]="block.label"
            (input)="onText(block.id, 'label', $event)"
          />
        </div>
        <div class="ed-field">
          <label class="ed-label" for="insp-hero-headline" [textContent]="i18n.t('field.headlineHtml')"></label>
          <textarea
            id="insp-hero-headline"
            class="ed-textarea"
            data-testid="insp-hero-headline"
            rows="3"
            [value]="block.headlineHtml"
            (input)="onText(block.id, 'headlineHtml', $event)"
          ></textarea>
        </div>
      }
      @case ('paragraph') {
        <div class="ed-field">
          <label class="ed-label" for="insp-para" [textContent]="i18n.t('field.paragraphHtml')"></label>
          <textarea
            id="insp-para"
            class="ed-textarea"
            data-testid="insp-paragraph-html"
            rows="5"
            [value]="block.html"
            (input)="onText(block.id, 'html', $event)"
          ></textarea>
        </div>
      }
      @case ('cta-button') {
        <div class="ed-field">
          <label class="ed-label" for="insp-cta-text" [textContent]="i18n.t('field.ctaText')"></label>
          <input
            id="insp-cta-text"
            class="ed-input"
            data-testid="insp-cta-text"
            [value]="block.text"
            (input)="onText(block.id, 'text', $event)"
          />
        </div>
        <div class="ed-field">
          <label class="ed-label" for="insp-cta-href" [textContent]="i18n.t('field.ctaHref')"></label>
          <input
            id="insp-cta-href"
            class="ed-input"
            data-testid="insp-cta-href"
            [value]="block.href"
            (input)="onText(block.id, 'href', $event)"
          />
        </div>
      }
      @case ('divider') {
        <div class="ed-field">
          <label class="ed-label" for="insp-div-style" [textContent]="i18n.t('field.dividerStyle')"></label>
          <select
            id="insp-div-style"
            class="ed-select"
            data-testid="insp-divider-style"
            [value]="block.style"
            (change)="onDividerStyle(block.id, $event)"
          >
            <option value="thin" [textContent]="i18n.t('divider.thin')"></option>
            <option value="accent-double" [textContent]="i18n.t('divider.accent-double')"></option>
            <option value="spacer-only" [textContent]="i18n.t('divider.spacer-only')"></option>
          </select>
        </div>
        @if (block.style === 'spacer-only') {
          <div class="ed-field">
            <label class="ed-label" for="insp-div-h" [textContent]="i18n.t('field.dividerHeight')"></label>
            <input
              id="insp-div-h"
              class="ed-input"
              type="number"
              min="8"
              max="120"
              [value]="block.heightPx ?? 24"
              (input)="onDividerHeight(block.id, $event)"
            />
          </div>
        }
      }
    }

    <div class="ed-actions">
      <button type="button" class="ed-btn" [attr.aria-label]="i18n.t('blocks.moveUp')" (click)="session.moveBlock(block.id, -1)">
        ↑
      </button>
      <button type="button" class="ed-btn" [attr.aria-label]="i18n.t('blocks.moveDown')" (click)="session.moveBlock(block.id, 1)">
        ↓
      </button>
      <button
        type="button"
        class="ed-btn ed-btn--danger"
        data-testid="insp-remove"
        [attr.aria-label]="i18n.t('blocks.remove')"
        (click)="session.removeBlock(block.id)"
      >
        ✕
      </button>
    </div>
  }
</section>
