@if (session.editingBlockId(); as editId) {
  <div
    class="block-edit-overlay"
    data-testid="block-edit-modal"
    [class.is-open]="openVisual()"
    [class.is-closing]="!openVisual()"
  >
    <div class="block-edit-backdrop" (click)="onBackdropClick()"></div>

    <div
      class="block-edit-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="block-edit-title"
      [style.left]="dialogStyle().left"
      [style.top]="dialogStyle().top"
      [style.width]="dialogStyle().width"
      [style.height]="dialogStyle().height"
    >
      <header
        class="block-edit-head"
        (pointerdown)="onHeadPointerDown($event)"
        (pointermove)="onHeadPointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      >
        <h2 id="block-edit-title" class="block-edit-title" [textContent]="titleText()"></h2>
        <span class="block-edit-drag-hint" aria-hidden="true">⋮⋮</span>
      </header>

      <div class="block-edit-body">
        <app-block-inspector />
      </div>

      <footer class="block-edit-foot">
        <button
          #cancelBtn
          type="button"
          class="block-edit-btn block-edit-btn--ghost"
          data-testid="block-edit-cancel"
          [textContent]="i18n.t('modal.cancel')"
          (click)="requestCancel()"
        ></button>
        <button
          type="button"
          class="block-edit-btn block-edit-btn--primary"
          data-testid="block-edit-save"
          [textContent]="i18n.t('modal.save')"
          (click)="requestSave()"
        ></button>
      </footer>

      <div
        class="block-edit-resize"
        aria-hidden="true"
        title="Resize"
        (pointerdown)="onResizePointerDown($event)"
        (pointermove)="onResizePointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      ></div>
    </div>
  </div>
}
