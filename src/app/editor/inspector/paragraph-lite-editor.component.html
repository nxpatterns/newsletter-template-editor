<div class="rt-kit" data-testid="paragraph-lite-editor">
  <div class="rt-toolbar" role="toolbar" [attr.aria-label]="i18n.t('rt.toolbar')">
    <button
      type="button"
      class="ed-btn"
      [title]="i18n.t('action.undo')"
      [disabled]="!canUndo()"
      (mousedown)="captureSelection($event)"
      (click)="undo()"
    >
      ↶
    </button>
    <button
      type="button"
      class="ed-btn"
      [title]="i18n.t('action.redo')"
      [disabled]="!canRedo()"
      (mousedown)="captureSelection($event)"
      (click)="redo()"
    >
      ↷
    </button>
    <span class="rt-sep" aria-hidden="true"></span>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.bold')" (mousedown)="captureSelection($event)" (click)="toggleMark('bold')">
      <strong>B</strong>
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.italic')" (mousedown)="captureSelection($event)" (click)="toggleMark('italic')">
      <em>I</em>
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.strike')" (mousedown)="captureSelection($event)" (click)="toggleMark('strikeThrough')">
      <s>S</s>
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.sup')" (mousedown)="captureSelection($event)" (click)="toggleMark('superscript')">
      x²
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.sub')" (mousedown)="captureSelection($event)" (click)="toggleMark('subscript')">
      x₂
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.mono')" (mousedown)="captureSelection($event)" (click)="toggleMono()">
      <span class="rt-mono-label">M</span>
    </button>
    <span class="rt-sep" aria-hidden="true"></span>
    <label class="rt-select-wrap">
      <span class="ed-label" [textContent]="i18n.t('rt.appearance')"></span>
      <select
        class="ed-select rt-select"
        (change)="applySize($any($event.target).value, $any($event.target))"
        (mousedown)="captureSelection()"
      >
        <option value="" disabled selected [textContent]="i18n.t('rt.appearance')"></option>
        @for (s of sizes; track s) {
          <option [value]="s" [textContent]="i18n.t('rt.size.' + s)"></option>
        }
      </select>
    </label>
    <label class="rt-select-wrap">
      <span class="ed-label" [textContent]="i18n.t('rt.color')"></span>
      <select
        class="ed-select rt-select"
        data-testid="rt-color-select"
        (change)="onColorChange($event)"
        (mousedown)="captureSelection()"
      >
        <option value="" disabled selected [textContent]="i18n.t('rt.color')"></option>
        @for (c of colors; track c) {
          <option [value]="c" [textContent]="i18n.t('rt.color.' + c)"></option>
        }
      </select>
    </label>
    <span class="rt-sep" aria-hidden="true"></span>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.link')" (mousedown)="captureSelection($event)" (click)="openLink()">
      🔗
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.unlink')" (mousedown)="captureSelection($event)" (click)="removeLink()">
      ⛓
    </button>
    <button type="button" class="ed-btn" [title]="i18n.t('rt.clear')" (mousedown)="$event.preventDefault()" (click)="clearFormatting()">
      ✎∅
    </button>
    <button
      type="button"
      class="ed-btn"
      data-testid="rt-remove-ai-chars"
      [title]="i18n.t('rt.removeAiChars')"
      [disabled]="suspiciousCount() === 0"
      (mousedown)="$event.preventDefault()"
      (click)="removeAiChars()"
      [textContent]="i18n.t('rt.removeAiChars')"
    ></button>
    <button
      type="button"
      class="ed-btn"
      data-testid="rt-code-view"
      [class.is-active]="codeView()"
      [title]="i18n.t('rt.codeView')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleCodeView()"
      [textContent]="i18n.t('rt.codeViewShort')"
    ></button>
    <span class="rt-sep" aria-hidden="true"></span>
    <button
      type="button"
      class="ed-btn"
      data-testid="rt-email-width"
      [class.is-active]="emailWidth()"
      [title]="i18n.t('rt.emailWidth')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleEmailWidth()"
      [textContent]="i18n.t('rt.emailWidthShort')"
    ></button>
    <button
      type="button"
      class="ed-btn rt-info-btn"
      data-testid="rt-info-mode"
      [class.is-active]="infoMode()"
      [title]="i18n.t('rt.infoMode')"
      [attr.aria-label]="i18n.t('rt.infoMode')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleInfoMode()"
    >
      i
    </button>
    <button
      type="button"
      class="ed-btn"
      data-testid="rt-stash-draft"
      [title]="i18n.t('rt.stashDraft')"
      (mousedown)="$event.preventDefault()"
      (click)="stashDraft()"
      [textContent]="i18n.t('rt.stashDraftShort')"
    ></button>
  </div>

  @if (stashFlash()) {
    <p class="rt-stash-flash" data-testid="rt-stash-flash" role="status" [textContent]="i18n.t('rt.stashFlash')"></p>
  }

  @if (linkOpen()) {
    <div class="rt-link-popover" data-testid="rt-link-popover">
      <label class="ed-label" for="rt-link-label" [textContent]="i18n.t('rt.linkLabel')"></label>
      <input
        id="rt-link-label"
        class="ed-input"
        type="text"
        data-testid="rt-link-label"
        [value]="linkLabel()"
        (input)="linkLabel.set($any($event.target).value)"
      />
      <label class="ed-label" for="rt-link-href" [textContent]="i18n.t('rt.linkHref')"></label>
      <input
        id="rt-link-href"
        class="ed-input"
        type="url"
        data-testid="rt-link-href"
        [value]="linkHref()"
        (input)="linkHref.set($any($event.target).value)"
      />
      <label class="ed-label" for="rt-link-target" [textContent]="i18n.t('rt.linkTarget')"></label>
      <select id="rt-link-target" class="ed-select" [value]="linkTarget()" (change)="linkTarget.set($any($event.target).value)">
        <option value="_blank" [textContent]="i18n.t('rt.linkTarget.blank')"></option>
        <option value="_self" [textContent]="i18n.t('rt.linkTarget.self')"></option>
      </select>
      <div class="ed-actions">
        <button type="button" class="ed-btn" data-testid="rt-link-apply" (click)="applyLink()" [textContent]="i18n.t('rt.linkApply')"></button>
        <button type="button" class="ed-btn" (click)="removeLink()" [textContent]="i18n.t('rt.unlink')"></button>
        <button type="button" class="ed-btn" (click)="cancelLink()" [textContent]="i18n.t('modal.cancel')"></button>
      </div>
    </div>
  }

  <p class="ed-field-help" [textContent]="i18n.t('rt.help')"></p>
  <p
    class="rt-ai-status"
    [class.rt-ai-status--found]="suspiciousCount() > 0"
    [class.rt-ai-status--ok]="suspiciousCount() === 0"
    data-testid="rt-ai-status"
    role="status"
    [textContent]="
      suspiciousCount() > 0
        ? i18n.t('rt.aiStatus.found', { n: suspiciousCount() })
        : i18n.t('rt.aiStatus.none')
    "
  ></p>

  <div
    #editor
    class="rt-editor rt-clone"
    data-testid="insp-paragraph-html"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    [class.rt-email-width]="emailWidth()"
    [class.rt-info]="infoMode()"
    [hidden]="codeView()"
    [attr.aria-label]="i18n.t('field.paragraphHtml')"
    (click)="onEditorClick($event)"
    (mouseup)="captureSelection()"
    (keyup)="captureSelection()"
    (input)="onEditorInput()"
    (paste)="onPaste($event)"
    (keydown)="onEditorKeydown($event)"
  ></div>

  @if (codeView()) {
    <pre
      class="rt-code"
      data-testid="rt-code-panel"
      tabindex="0"
      role="textbox"
      aria-readonly="true"
      [attr.aria-label]="i18n.t('rt.codeView')"
      [textContent]="codeText()"
    ></pre>
  }
</div>
