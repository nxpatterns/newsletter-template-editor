<section class="catalog-tab" data-testid="catalog-tab">
  <p class="ed-hint" [textContent]="i18n.t('catalog.hint')"></p>
  <div class="catalog-grid" role="list" data-testid="block-catalog">
    @for (type of types; track type) {
      <div
        class="catalog-card"
        [class.catalog-card--cancelled]="cancelledType() === type"
        [class.catalog-card--dragging]="catalogDrag.activeType() === type"
        role="listitem"
        draggable="true"
        [attr.data-testid]="'add-block-' + type"
        [attr.aria-label]="label(type)"
        [attr.title]="i18n.t('catalog.dragHint')"
        [style.--cat-a]="hue(type).a"
        [style.--cat-b]="hue(type).b"
        [style.--cat-ink]="hue(type).ink"
        (dragstart)="onDragStart(type, $event)"
        (dragend)="onDragEnd(type, $event)"
      >
        <span class="catalog-card__icon" aria-hidden="true" [textContent]="icon(type)"></span>
        <span class="catalog-card__label" [textContent]="label(type)"></span>
        <span class="catalog-card__hint" [textContent]="hint(type)"></span>
        <span class="catalog-card__drag" aria-hidden="true">⋮⋮</span>
        @if (badge(type); as badgeText) {
          <span class="catalog-card__foot" [attr.data-testid]="'catalog-badge-' + type">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z" /></svg>
            <span [textContent]="badgeText"></span>
          </span>
        }
      </div>
    }
  </div>
</section>
