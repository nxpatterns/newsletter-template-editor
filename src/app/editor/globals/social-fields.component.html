@let l = session.globals().legal;
@let filled = filledNetworks();

<section class="ed-group" data-testid="social-fields" [class.is-hidden-part]="!shown('social')">
  <p class="ed-group-title">
    <span [textContent]="i18n.t('legal.socialTitle')"></span>
    <span class="social-count" data-testid="social-count" [textContent]="i18n.t('social.count', { n: filled.length, total: networks.length })"></span>
    <app-frame-part-switch part="social" />
  </p>
  <p class="social-strip-cap" [textContent]="i18n.t('social.stripCaption')"></p>
  <div class="social-strip" data-testid="social-strip" [style.color]="session.palette().head" [style.background]="footerBg()">
    @for (n of filled; track n.id) {
      <span class="social-ico" [attr.title]="n.label" [attr.data-testid]="'social-strip-' + n.id" [style.mask-image]="'url(' + iconDir + '/' + n.id + '.svg)'"></span>
    } @empty {
      <span class="social-strip-empty" [textContent]="i18n.t('social.stripEmpty')"></span>
    }
  </div>
  <p class="ed-hint" [textContent]="i18n.t('legal.socialHint')"></p>
  <div class="social-list">
    @for (n of networks; track n.id) {
      @let empty = !(l.social[n.id] ?? '').trim();
      <label class="social-row" [class.is-empty]="empty" [attr.for]="'g-social-' + n.id">
        <span class="social-ico" aria-hidden="true" [style.mask-image]="'url(' + iconDir + '/' + n.id + '.svg)'"></span>
        <span class="social-name" [textContent]="n.label"></span>
      </label>
      <input
        class="ed-input social-input"
        [class.is-empty]="empty"
        [id]="'g-social-' + n.id"
        [attr.data-testid]="'g-social-' + n.id"
        [attr.aria-label]="n.label + ': ' + i18n.t('legal.socialTarget')"
        [placeholder]="placeholders[n.id]"
        [value]="l.social[n.id]"
        (input)="onSocial(n.id, $event)"
        (blur)="onSocialBlur(n.id)"
      />
    }
  </div>
</section>
