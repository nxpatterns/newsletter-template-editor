@let l = session.globals().legal;

<section data-testid="legal-fields">
  <div class="ed-field">
    <label class="ed-label" for="g-notice" [textContent]="i18n.t('legal.notice')"></label>
    <textarea id="g-notice" class="ed-textarea" rows="3" [value]="l.noticeHtml" (input)="onLegal('noticeHtml', $event)" (blur)="onFieldBlur()"></textarea>
  </div>
  <div class="ed-field">
    <label class="ed-label" for="g-company-name" [textContent]="i18n.t('legal.companyName')"></label>
    <input
      id="g-company-name"
      class="ed-input"
      data-testid="g-company"
      [value]="l.companyName"
      (input)="onLegal('companyName', $event)"
     (blur)="onFieldBlur()" />
  </div>
  <div class="ed-field-row">
    <div class="ed-field">
      <label class="ed-label" for="g-company-site-l" [textContent]="i18n.t('legal.companyWebsiteText')"></label>
      <input
        id="g-company-site-l"
        class="ed-input"
        data-testid="g-company-site-text"
        [value]="l.companyWebsiteLabel"
        (input)="onLegal('companyWebsiteLabel', $event)"
       (blur)="onFieldBlur()" />
    </div>
    <div class="ed-field">
      <label class="ed-label" for="g-company-site-h" [textContent]="i18n.t('legal.companyWebsiteTarget')"></label>
      <input
        id="g-company-site-h"
        class="ed-input"
        data-testid="g-company-site-target"
        [placeholder]="i18n.t('legal.companyWebsitePlaceholder')"
        [value]="l.companyWebsiteHref"
        (input)="onLegal('companyWebsiteHref', $event)"
        (blur)="onTargetBlur('companyWebsiteHref')" />
    </div>
  </div>
  <div class="ed-field-row">
    <div class="ed-field">
      <label class="ed-label" for="g-priv-l" [textContent]="i18n.t('legal.privacyText')"></label>
      <input id="g-priv-l" class="ed-input" [value]="l.privacyLabel" (input)="onLegal('privacyLabel', $event)"  (blur)="onFieldBlur()" />
    </div>
    <div class="ed-field">
      <label class="ed-label" for="g-priv-h" [textContent]="i18n.t('legal.privacyTarget')"></label>
      <input id="g-priv-h" class="ed-input" [value]="l.privacyHref" [placeholder]="i18n.t('legal.privacyPlaceholder')" (input)="onLegal('privacyHref', $event)" (blur)="onTargetBlur('privacyHref')" />
    </div>
  </div>
  <div class="ed-field-row">
    <div class="ed-field">
      <label class="ed-label" for="g-imp-l" [textContent]="i18n.t('legal.imprintText')"></label>
      <input id="g-imp-l" class="ed-input" [value]="l.imprintLabel" (input)="onLegal('imprintLabel', $event)"  (blur)="onFieldBlur()" />
    </div>
    <div class="ed-field">
      <label class="ed-label" for="g-imp-h" [textContent]="i18n.t('legal.imprintTarget')"></label>
      <input id="g-imp-h" class="ed-input" [value]="l.imprintHref" [placeholder]="i18n.t('legal.imprintPlaceholder')" (input)="onLegal('imprintHref', $event)" (blur)="onTargetBlur('imprintHref')" />
    </div>
  </div>
  <div class="ed-field">
    <label class="ed-label" for="g-unsub" [textContent]="i18n.t('legal.unsubscribe')"></label>
    <input id="g-unsub" class="ed-input" [value]="l.unsubscribeLabel" (input)="onLegal('unsubscribeLabel', $event)"  (blur)="onFieldBlur()" />
  </div>
  <div class="ed-field">
    <label class="ed-label" for="g-view" [textContent]="i18n.t('legal.viewInBrowser')"></label>
    <input id="g-view" class="ed-input" [value]="l.viewInBrowserLabel" (input)="onLegal('viewInBrowserLabel', $event)"  (blur)="onFieldBlur()" />
  </div>
  <section class="ed-group" data-testid="social-fields">
    <h3 class="ed-group-title" [textContent]="i18n.t('legal.socialTitle')"></h3>
    <p class="ed-hint" [textContent]="i18n.t('legal.socialHint')"></p>
    <div class="social-list">
      @for (n of networks; track n.id) {
        <label class="social-row" [attr.for]="'g-social-' + n.id">
          <span class="social-ico" aria-hidden="true" [style.mask-image]="'url(' + iconDir + '/' + n.id + '.svg)'"></span>
          <span class="social-name" [textContent]="n.label"></span>
        </label>
        <input
          class="ed-input"
          [id]="'g-social-' + n.id"
          [attr.data-testid]="'g-social-' + n.id"
          [attr.aria-label]="n.label + ': ' + i18n.t('legal.socialTarget')"
          [placeholder]="placeholders[n.id]"
          [value]="l.social[n.id]"
          (input)="onSocial(n.id, $event)"
          (blur)="onSocialBlur(n.id)"
        />
      }
    </div>
  </section>
</section>
