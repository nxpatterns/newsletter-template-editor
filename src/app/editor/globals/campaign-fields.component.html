@let g = session.globals();
@let subject = g.campaignSubject ?? '';
@let prefix = g.exportFileNamePrefix || session.displayName();

<section data-testid="campaign-fields">
  <div class="inbox" data-testid="campaign-inbox" aria-hidden="true">
    <p class="inbox-cap" [textContent]="i18n.t('campaign.inboxCaption')"></p>
    <div class="inbox-row">
      <span class="inbox-avatar" [textContent]="sender().charAt(0).toUpperCase()"></span>
      <span class="inbox-from" [textContent]="sender()"></span>
      <span class="inbox-subject" data-testid="campaign-inbox-subject" [textContent]="subject || i18n.t('campaign.inboxSubjectEmpty')"></span>
      <span class="inbox-pre" data-testid="campaign-inbox-pre" [textContent]="g.preheader || i18n.t('campaign.inboxPreEmpty')"></span>
    </div>
  </div>

  <div class="ed-group group-card group-card--blue" data-testid="campaign-group-inbox">
    <p class="ed-group-title">
      <span class="ed-group-n" aria-hidden="true">1</span>
      <span [textContent]="i18n.t('campaign.groupInbox')"></span>
    </p>
    <div class="ed-field">
      <div class="count-row">
        <label class="ed-label" for="g-subject" [textContent]="i18n.t('campaign.subject')"></label>
        <span class="count" data-testid="g-subject-count" [class.is-over]="subject.length > subjectMax" [textContent]="subject.length + ' / ' + subjectMax"></span>
      </div>
      <input
        id="g-subject"
        class="ed-input"
        data-testid="g-subject"
        [value]="subject"
        (input)="onString('campaignSubject', $event)"
        (blur)="onFieldBlur()" />
      <span class="count-bar" aria-hidden="true"><i [class.is-over]="subject.length > subjectMax" [style.width.%]="subject.length / subjectMax * 100"></i></span>
      <p class="ed-hint" [textContent]="i18n.t('campaign.subjectHint')"></p>
    </div>
    <div class="ed-field">
      <div class="count-row">
        <label class="ed-label" for="g-preheader" [textContent]="i18n.t('campaign.preheader')"></label>
        <span class="count" data-testid="g-preheader-count" [class.is-over]="g.preheader.length > preheaderMax" [textContent]="g.preheader.length + ' / ' + preheaderMax"></span>
      </div>
      <textarea
        id="g-preheader"
        class="ed-textarea ed-textarea--resizable"
        data-testid="g-preheader"
        rows="3"
        appPersistHeight="campaign.preheader"
        [value]="g.preheader"
        (input)="onString('preheader', $event)"
        (blur)="onFieldBlur()"></textarea>
      <span class="count-bar" aria-hidden="true"><i [class.is-over]="g.preheader.length > preheaderMax" [style.width.%]="g.preheader.length / preheaderMax * 100"></i></span>
      <p class="ed-hint" data-testid="g-preheader-help" [textContent]="i18n.t('campaign.preheaderHelp')"></p>
    </div>
  </div>

  <div class="ed-group group-card group-card--green" data-testid="campaign-group-font">
    <p class="ed-group-title">
      <span class="ed-group-n" aria-hidden="true">2</span>
      <span id="g-font-label" [textContent]="i18n.t('campaign.font')"></span>
    </p>
    <div class="font-tiles" role="radiogroup" aria-labelledby="g-font-label" data-testid="g-font">
      @for (opt of fonts; track opt.value) {
        <button
          type="button"
          class="font-tile"
          role="radio"
          [class.is-on]="g.fontFamily === opt.value"
          [attr.aria-checked]="g.fontFamily === opt.value"
          [attr.data-testid]="'g-font-' + opt.value"
          [attr.title]="opt.label"
          [style.font-family]="opt.stack"
          (click)="setFont(opt.value)"
        >
          <b aria-hidden="true">Aa</b>
          <span [textContent]="opt.short"></span>
        </button>
      }
      <button
        type="button"
        class="font-tile"
        role="radio"
        [class.is-on]="g.fontFamily === 'Custom'"
        [attr.aria-checked]="g.fontFamily === 'Custom'"
        data-testid="g-font-Custom"
        (click)="setFont('Custom')"
      >
        <b aria-hidden="true">…</b>
        <span [textContent]="i18n.t('campaign.fontCustomTile')"></span>
      </button>
    </div>
    @if (g.fontFamily === 'Custom') {
      <div class="ed-field">
        <label class="ed-label" for="g-custom-font" [textContent]="i18n.t('campaign.customFont')"></label>
        <input
          id="g-custom-font"
          class="ed-input"
          data-testid="g-custom-font"
          [value]="g.customFont ?? ''"
          (input)="onString('customFont', $event)"
          (blur)="onFieldBlur()" />
      </div>
    }
  </div>

  <div class="ed-group group-card group-card--gold" data-testid="campaign-group-export-prefix">
    <p class="ed-group-title">
      <span class="ed-group-n" aria-hidden="true">3</span>
      <span [textContent]="i18n.t('campaign.groupExportPrefix')"></span>
    </p>
    <div class="ed-field">
      <label class="ed-label" for="g-export-prefix" [textContent]="i18n.t('campaign.exportPrefix')"></label>
      <input
        id="g-export-prefix"
        class="ed-input"
        data-testid="g-export-prefix"
        [value]="g.exportFileNamePrefix"
        (input)="onString('exportFileNamePrefix', $event)"
        (blur)="onFieldBlur()" />
      <p class="export-files" data-testid="g-export-files">
        <span aria-hidden="true">→ </span>{{ prefix }}-template.html, {{ prefix }}-body.html
      </p>
    </div>
  </div>
</section>
