<div class="work-area" [class.work-area--panel-collapsed]="shellUi.panelCollapsed()">
  <section class="preview-panel" [attr.aria-label]="i18n.t('preview.label')">
    <iframe
      class="preview-frame"
      title="Newsletter preview"
      data-testid="preview-frame"
      [srcdoc]="previewSrcdoc()"
    ></iframe>
  </section>

  <aside
    class="side-panel"
    data-testid="side-panel"
    [class.collapsed]="shellUi.panelCollapsed()"
    [class.is-resizing]="resizing()"
    [style.width]="shellUi.panelCollapsed() ? null : shellUi.panelWidthPx() + 'px'"
    [style.min-width]="shellUi.panelCollapsed() ? null : shellUi.panelWidthPx() + 'px'"
    [attr.aria-label]="i18n.t('panel.tabs')"
  >
    <button
      type="button"
      class="side-panel-resizer"
      data-testid="side-panel-resizer"
      [attr.aria-label]="i18n.t('action.panelResize')"
      [attr.title]="i18n.t('action.panelResize')"
      [disabled]="shellUi.panelCollapsed()"
      (pointerdown)="onResizePointerDown($event)"
      (pointermove)="onResizePointerMove($event)"
      (pointerup)="onResizePointerUp($event)"
      (pointercancel)="onResizePointerUp($event)"
    ></button>

    <div class="side-panel-header">
      <button
        type="button"
        class="side-panel-toggle"
        id="side-toggle"
        data-testid="side-panel-toggle"
        [attr.title]="i18n.t('action.panelToggle')"
        [attr.aria-label]="i18n.t('action.panelToggle')"
        [attr.aria-expanded]="!shellUi.panelCollapsed()"
        (click)="shellUi.togglePanel()"
      >
        »
      </button>
    </div>

    <div class="side-panel-body">
      <app-editor-panel />
    </div>
  </aside>
</div>
