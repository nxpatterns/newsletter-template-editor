@if (confirm.pending(); as p) {
  <div
    class="confirm-overlay"
    data-testid="confirm-dialog"
    [class.is-open]="openVisual()"
    [class.is-closing]="!openVisual()"
  >
    <div class="confirm-backdrop" (click)="onBackdrop()"></div>
    <div
      class="confirm-dialog"
      [class.confirm-dialog--warning]="p.mode === 'confirm' && !!p.warning"
      [attr.role]="p.mode === 'confirm' && p.warning ? 'alertdialog' : 'dialog'"
      aria-modal="true"
      aria-labelledby="confirm-title"
    >
      <header class="confirm-head">
        <h2 id="confirm-title" class="confirm-title">
          @if (p.mode === 'confirm' && p.warning) {
            <span class="confirm-warning-icon" aria-hidden="true">⚠</span>
          }
          <span [textContent]="p.title"></span>
        </h2>
      </header>
      <div class="confirm-body">
        @if (p.body) {
          <p class="confirm-text" [textContent]="p.body"></p>
        }
        @if (p.mode === 'confirm' && p.note) {
          <p class="confirm-note" data-testid="confirm-note" [textContent]="p.note"></p>
        }
        @if (p.mode === 'confirm' && p.acknowledge) {
          <label class="confirm-ack">
            <input
              type="checkbox"
              class="confirm-ack-box"
              data-testid="confirm-acknowledge"
              [checked]="acknowledged()"
              (change)="onAcknowledge($event)"
            />
            <span [textContent]="p.acknowledge"></span>
          </label>
        }
        @if (p.mode === 'prompt') {
          <label class="confirm-input-label" for="confirm-prompt-input" [textContent]="p.inputLabel"></label>
          <input
            #promptInput
            id="confirm-prompt-input"
            class="confirm-input"
            type="text"
            data-testid="confirm-prompt-input"
            [value]="promptValue()"
            (input)="onPromptInput($event)"
            (keydown.enter)="onConfirm()"
          />
        }
      </div>
      <footer class="confirm-foot">
        <button
          #cancelBtn
          type="button"
          class="confirm-btn confirm-btn--ghost"
          data-testid="confirm-cancel"
          [textContent]="p.cancelLabel"
          (click)="onCancel()"
        ></button>
        @if (p.mode === 'choice') {
          <button
            type="button"
            class="confirm-btn confirm-btn--ghost confirm-btn--alt"
            data-testid="confirm-alt"
            [textContent]="p.altLabel"
            (click)="onAlt()"
          ></button>
        }
        <button
          type="button"
          class="confirm-btn"
          data-testid="confirm-ok"
          [disabled]="needsAcknowledge()"
          [class.confirm-btn--primary]="p.mode !== 'confirm' || !p.danger"
          [class.confirm-btn--danger]="p.mode === 'confirm' && !!p.danger"
          [textContent]="p.confirmLabel"
          (click)="onConfirm()"
        ></button>
      </footer>
    </div>
  </div>
}
