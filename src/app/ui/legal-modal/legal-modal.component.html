<dialog
  #dialog
  class="legal-dialog"
  data-testid="legal-modal"
  (close)="onDialogClose()"
>
  <header class="legal-dialog__head">
    <h2 id="legal-modal-title" class="legal-dialog__title" [textContent]="i18n.t(titleKey())"></h2>
    <button
      type="button"
      class="legal-dialog__close"
      [attr.aria-label]="i18n.t('modal.close')"
      data-testid="legal-modal-close"
      (click)="requestClose()"
    >
      ×
    </button>
  </header>

  <div class="legal-dialog__body" aria-labelledby="legal-modal-title">
    @if (kind() === 'impressum') {
      <p [textContent]="i18n.t('impressum.intro')"></p>
      <p>
        <span [textContent]="i18n.t('impressum.coffee')"></span>
        <a
          href="https://www.buymeacoffee.com/ebuelbuel"
          target="_blank"
          rel="noopener noreferrer"
          >buymeacoffee.com/ebuelbuel</a
        >.
        <span [textContent]="i18n.t('impressum.thanks')"></span>
      </p>
      <h3 [textContent]="i18n.t('impressum.techTitle')"></h3>
      <p [textContent]="i18n.t('impressum.techBody')"></p>
      <h3 [textContent]="i18n.t('impressum.legalTitle')"></h3>
      <p class="legal-dialog__label" [textContent]="i18n.t('impressum.operator')"></p>
      <pre class="legal-dialog__pre" [textContent]="i18n.t('impressum.operatorLines')"></pre>
      <p class="legal-dialog__label" [textContent]="i18n.t('impressum.represented')"></p>
      <pre class="legal-dialog__pre" [textContent]="i18n.t('impressum.representedLines')"></pre>
      <pre class="legal-dialog__pre" [textContent]="i18n.t('impressum.courtLines')"></pre>
      <h3 [textContent]="i18n.t('impressum.creditsTitle')"></h3>
      <pre class="legal-dialog__pre" [textContent]="i18n.t('impressum.creditsBody')"></pre>
    } @else if (kind() === 'privacy') {
      <h3 [textContent]="i18n.t('privacy.prefsTitle')"></h3>
      <p [textContent]="i18n.t('privacy.prefsIntro')"></p>
      <ul>
        <li [textContent]="i18n.t('privacy.key')"></li>
        <li [textContent]="i18n.t('privacy.stored')"></li>
        <li [textContent]="i18n.t('privacy.notStored')"></li>
        <li [textContent]="i18n.t('privacy.where')"></li>
        <li [textContent]="i18n.t('privacy.remove')"></li>
      </ul>
      <p [textContent]="i18n.t('privacy.necessary')"></p>
      <h3 [textContent]="i18n.t('privacy.analyticsTitle')"></h3>
      <p [textContent]="i18n.t('privacy.analyticsBody')"></p>
    }
  </div>
</dialog>
