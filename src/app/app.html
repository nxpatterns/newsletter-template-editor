<main class="app-shell">
  <header class="app-header">
    <h1>{{ title() }}</h1>
    <p class="tagline">ListMonk-style HTML email · demo brand CloudLib.EU</p>

    <div
      ngToolbar
      class="app-toolbar"
      aria-label="Editor actions"
      cdkMonitorSubtreeFocus
    >
      <button
        type="button"
        ngToolbarWidget
        class="toolbar-btn"
        value="save"
        data-testid="action-save"
        (click)="save()"
      >
        Save
      </button>
      <button
        type="button"
        ngToolbarWidget
        class="toolbar-btn"
        value="reset"
        data-testid="action-reset"
        (click)="resetSeed()"
      >
        Reset seed
      </button>
    </div>
  </header>

  <section class="preview-panel" aria-label="Email preview">
    <iframe
      class="preview-frame"
      title="Newsletter preview"
      [srcdoc]="previewSrcdoc()"
    ></iframe>
  </section>
</main>

<footer class="app-footer" aria-label="Application version">
  <span class="app-footer__version" data-testid="app-version">{{ appVersion }}</span>
</footer>

<app-snackbar />
