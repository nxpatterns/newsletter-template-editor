<div class="app-shell" data-testid="app-shell">
  <!-- Material Symbols Outlined paths (Apache-2.0), same undo/redo as image2colors -->
  <svg class="app-icon-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-undo" viewBox="0 -960 960 960">
        <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z" />
      </symbol>
      <symbol id="icon-redo" viewBox="0 -960 960 960">
        <path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z" />
      </symbol>
      <symbol id="icon-save" viewBox="0 -960 960 960">
        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-120H640v80h-80v-80H200v120Zm0-200h560v-360H200v360Zm0 200v-560 560Z" />
      </symbol>
      <symbol id="icon-reset" viewBox="0 -960 960 960">
        <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z" />
      </symbol>
    </defs>
  </svg>

  <header class="app-header">
    <div class="app-header-bar">
      <div class="app-header-brand">
        <h1 class="app-header-title" data-testid="app-title" [textContent]="i18n.t('shell.title')"></h1>
        <div class="app-header-subtitle" [textContent]="i18n.t('shell.subtitle')"></div>
      </div>

      <div class="app-header-actions">
        <div
          ngToolbar
          class="app-toolbar"
          aria-label="Editor actions"
          data-testid="app-toolbar"
        >
          <button
            type="button"
            ngToolbarWidget
            class="toolbar-btn"
            value="undo"
            data-testid="action-undo"
            [disabled]="!session.canUndo()"
            [attr.aria-label]="i18n.t('action.undo')"
            [attr.title]="i18n.t('action.undo')"
            (click)="session.undo()"
          >
            <svg class="toolbar-icon" aria-hidden="true" focusable="false">
              <use href="#icon-undo"></use>
            </svg>
          </button>
          <button
            type="button"
            ngToolbarWidget
            class="toolbar-btn"
            value="redo"
            data-testid="action-redo"
            [disabled]="!session.canRedo()"
            [attr.aria-label]="i18n.t('action.redo')"
            [attr.title]="i18n.t('action.redo')"
            (click)="session.redo()"
          >
            <svg class="toolbar-icon" aria-hidden="true" focusable="false">
              <use href="#icon-redo"></use>
            </svg>
          </button>
          <button
            type="button"
            ngToolbarWidget
            class="toolbar-btn"
            value="save"
            data-testid="action-save"
            [attr.aria-label]="i18n.t('action.save')"
            [attr.title]="i18n.t('action.save')"
            (click)="session.save()"
          >
            <svg class="toolbar-icon" aria-hidden="true" focusable="false">
              <use href="#icon-save"></use>
            </svg>
          </button>
          <button
            type="button"
            ngToolbarWidget
            class="toolbar-btn"
            value="reset"
            data-testid="action-reset"
            [attr.aria-label]="i18n.t('action.reset')"
            [attr.title]="i18n.t('action.reset')"
            (click)="session.resetSeed()"
          >
            <svg class="toolbar-icon" aria-hidden="true" focusable="false">
              <use href="#icon-reset"></use>
            </svg>
          </button>
        </div>

        <div class="locale-switch" role="group" [attr.aria-label]="i18n.t('action.locale')">
          <button
            type="button"
            class="locale-btn"
            data-testid="locale-en"
            [class.is-active]="i18n.locale() === 'en'"
            [attr.aria-pressed]="i18n.locale() === 'en'"
            [textContent]="i18n.t('locale.en')"
            (click)="setLocale('en')"
          ></button>
          <button
            type="button"
            class="locale-btn"
            data-testid="locale-de"
            [class.is-active]="i18n.locale() === 'de'"
            [attr.aria-pressed]="i18n.locale() === 'de'"
            [textContent]="i18n.t('locale.de')"
            (click)="setLocale('de')"
          ></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <div class="app-footer-bar">
      <div class="app-footer-left"></div>
      <nav class="app-footer-center" aria-label="Legal">
        <button
          type="button"
          class="footer-link"
          data-testid="footer-impressum"
          [textContent]="i18n.t('footer.impressum')"
          (click)="openLegal('impressum')"
        ></button>
        <span class="app-footer-separator" aria-hidden="true">·</span>
        <button
          type="button"
          class="footer-link"
          data-testid="footer-privacy"
          [textContent]="i18n.t('footer.privacy')"
          (click)="openLegal('privacy')"
        ></button>
        <span class="app-footer-separator" aria-hidden="true">·</span>
        <a
          class="footer-link"
          routerLink="/about"
          data-testid="footer-about"
          [textContent]="i18n.t('footer.about')"
        ></a>
      </nav>
      <div class="app-footer-right">
        <span
          class="app-footer-version"
          data-testid="app-version"
          [attr.aria-label]="i18n.t('footer.version')"
          [textContent]="appVersion"
        ></span>
      </div>
    </div>
  </footer>
</div>

<app-block-edit-modal />
<app-legal-modal [kind]="legalKind()" (closed)="closeLegal()" />
<app-snackbar />
