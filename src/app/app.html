<div class="app-shell" data-testid="app-shell">
  <!-- Material Symbols Outlined paths (Apache-2.0), same undo/redo as image2colors -->
  <svg class="app-icon-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-undo" viewBox="0 -960 960 960">
        <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z" />
      </symbol>
      <symbol id="icon-redo" viewBox="0 -960 960 960">
        <path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z" />
      </symbol>
      <symbol id="icon-save" viewBox="0 -960 960 960">
        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-120H640v80h-80v-80H200v120Zm0-200h560v-360H200v360Zm0 200v-560 560Z" />
      </symbol>
      <symbol id="icon-start" viewBox="0 -960 960 960">
        <path d="M240-200h120v-240h240v240h120v-360L480-750 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
      </symbol>
      <symbol id="icon-back" viewBox="0 -960 960 960">
        <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
      </symbol>
    </defs>
  </svg>

  <header class="app-header">
    <div class="app-header-bar">
      <div class="app-header-lead">
      @if (!onStart()) {
        <a
          class="toolbar-btn app-header-home-btn"
          routerLink="/"
          data-testid="action-home"
          [attr.aria-label]="i18n.t('start.headerTitle')"
          [attr.title]="i18n.t('start.headerTitle')"
        >
          <svg class="toolbar-icon" aria-hidden="true" focusable="false">
            <use href="#icon-start"></use>
          </svg>
        </a>
      }
      <div class="app-header-brand">
        @if (onStart()) {
          <h1 class="app-header-title" data-testid="app-title" [textContent]="i18n.t('shell.title')"></h1>
        } @else {
          <h1 class="app-header-title">
            <a
              class="app-header-home"
              routerLink="/"
              data-testid="action-start"
              [attr.title]="i18n.t('start.headerTitle')"
            ><span data-testid="app-title" [textContent]="i18n.t('shell.title')"></span></a>
          </h1>
        }
        @if (inEditor()) {
          <div class="app-header-doc">
            <span class="app-header-doc-name" data-testid="doc-name" [textContent]="session.displayName()"></span>
            <ng-container [ngTemplateOutlet]="saveState" />
          </div>
        } @else if (onAbout() && session.hasDocument()) {
          <div class="app-header-doc">
            <a class="app-header-back" [routerLink]="['/edit', session.routeId()]" data-testid="action-back-to-doc">
              <svg class="app-header-back-icon" aria-hidden="true" focusable="false">
                <use href="#icon-back"></use>
              </svg>
              <span [textContent]="i18n.t('about.backToDoc')"></span>
              <span class="app-header-doc-name" [textContent]="session.displayName()"></span>
            </a>
            <ng-container [ngTemplateOutlet]="saveState" />
          </div>
        }
        <ng-template #saveState>
          @if (session.discardedNotice()) {
            <span class="save-state save-state--saved" data-testid="save-state-discarded" role="status">
              <span [textContent]="i18n.t('file.statusDiscarded')"></span>
            </span>
          } @else if (session.dirty()) {
            <span class="save-state save-state--dirty" data-testid="save-state" role="status">
              <span class="save-state-dot" aria-hidden="true"></span>
              <span [textContent]="i18n.t('file.statusUnsaved')"></span>
            </span>
          } @else if (session.libraryId()) {
            <span class="save-state save-state--saved" data-testid="save-state" role="status">
              <span aria-hidden="true">✓</span>
              <span [textContent]="i18n.t('file.statusSaved')"></span>
            </span>
          }
        </ng-template>
      </div>
      </div>

      <div class="app-header-actions">
        @if (inEditor()) {
          <div
            ngToolbar
            class="app-toolbar"
            aria-label="Editor actions"
            data-testid="app-toolbar"
          >
            <button
              type="button"
              ngToolbarWidget
              class="toolbar-btn"
              value="undo"
              data-testid="action-undo"
              [disabled]="!session.canUndo()"
              [attr.aria-label]="i18n.t('action.undo')"
              [attr.title]="i18n.t('action.undo')"
              (click)="session.undo()"
            >
              <svg class="toolbar-icon" aria-hidden="true" focusable="false">
                <use href="#icon-undo"></use>
              </svg>
            </button>
            <button
              type="button"
              ngToolbarWidget
              class="toolbar-btn"
              value="redo"
              data-testid="action-redo"
              [disabled]="!session.canRedo()"
              [attr.aria-label]="i18n.t('action.redo')"
              [attr.title]="i18n.t('action.redo')"
              (click)="session.redo()"
            >
              <svg class="toolbar-icon" aria-hidden="true" focusable="false">
                <use href="#icon-redo"></use>
              </svg>
            </button>
          </div>
          <app-file-menu />
        } @else if (onStart()) {
          <app-start-menu />
        }

        <div class="locale-switch" role="group" [attr.aria-label]="i18n.t('action.locale')">
          <button
            type="button"
            class="locale-btn"
            data-testid="locale-en"
            [class.is-active]="i18n.locale() === 'en'"
            [attr.aria-pressed]="i18n.locale() === 'en'"
            [textContent]="i18n.t('locale.en')"
            (click)="setLocale('en')"
          ></button>
          <button
            type="button"
            class="locale-btn"
            data-testid="locale-de"
            [class.is-active]="i18n.locale() === 'de'"
            [attr.aria-pressed]="i18n.locale() === 'de'"
            [textContent]="i18n.t('locale.de')"
            (click)="setLocale('de')"
          ></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <div class="app-footer-bar">
      <div class="app-footer-left"></div>
      <nav class="app-footer-center" aria-label="Legal">
        <a
          class="footer-link"
          routerLink="/"
          data-testid="footer-home"
          [attr.aria-current]="onStart() ? 'page' : null"
          [textContent]="i18n.t('footer.home')"
        ></a>
        <span class="app-footer-separator" aria-hidden="true">·</span>
        <button
          type="button"
          class="footer-link"
          data-testid="footer-impressum"
          [textContent]="i18n.t('footer.impressum')"
          (click)="openLegal('impressum')"
        ></button>
        <span class="app-footer-separator" aria-hidden="true">·</span>
        <button
          type="button"
          class="footer-link"
          data-testid="footer-privacy"
          [textContent]="i18n.t('footer.privacy')"
          (click)="openLegal('privacy')"
        ></button>
        <span class="app-footer-separator" aria-hidden="true">·</span>
        <a
          class="footer-link"
          routerLink="/about"
          data-testid="footer-about"
          [textContent]="i18n.t('footer.about')"
        ></a>
      </nav>
      <div class="app-footer-right">
        <span
          class="app-footer-version"
          data-testid="app-version"
          [attr.aria-label]="i18n.t('footer.version')"
          [textContent]="appVersion"
        ></span>
      </div>
    </div>
  </footer>
</div>

<app-block-edit-modal />
<app-legal-modal [kind]="legalKind()" (closed)="closeLegal()" />
<app-confirm-dialog />
<app-snackbar />
