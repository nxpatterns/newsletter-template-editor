<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup R2 Bausteinleiste</title>
<style>
:root {
  --ds-bg-page: #060b14; --ds-bg-panel: #0c1628; --ds-border: #1a3050; --ds-accent: #7ecfff;
  --ds-text: #e8f4ff; --ds-text-muted: #7a9ab8; --ds-success: #3dd68c; --ds-warning: #f5b84a; --ds-danger: #ff6b7a;
  --ds-radius: .25rem;
  --glass: color-mix(in srgb, var(--ds-bg-panel) 78%, transparent);
  --glass-edge: linear-gradient(90deg, transparent, rgba(255,255,255,.35) 50%, transparent);
  --head-bg: linear-gradient(180deg, rgba(255,255,255,.12), transparent 42%), linear-gradient(120deg, #0a1830 0%, #123a5c 48%, #0c5a78 100%);
  --sel: #20d4c8; --newmark: #f5c518;
  --free-a: #a3b8cc; --free-b: #52677d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ds-text); background: var(--ds-bg-page); display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ds-accent); outline-offset: 2px; }

/* mockup controls (not part of the design) */
.mk { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; align-items: center; padding: .45rem .9rem; background: #2a1d05; border-bottom: 1px dashed #8a6a20; color: #f3d9a0; font-size: 12px; }
.mk b { font-weight: 600; margin-inline-end: .3rem; }
.mk .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #8a6a20; border-radius: .8rem; overflow: hidden; }
.mk .seg button { background: none; border: 0; padding: .2rem .6rem; color: #f3d9a0; }
.mk .seg button[aria-pressed="true"] { background: #8a6a20; color: #fff; }
.mk label { display: inline-flex; gap: .3rem; align-items: center; }
.mk .note { flex: 1 1 100%; color: #d8b870; }
.mk a { margin-inline-start: auto; }
.is-new { outline: 2px dashed var(--newmark); outline-offset: 2px; }
.hide-new .is-new { outline: 0; }

/* app header */
.hdr { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; min-height: 3.5rem; padding: .45rem .9rem; background: var(--ds-bg-panel); border-bottom: 1px solid var(--ds-border); }
.hdr .brand { font-weight: 600; }
.hdr .doc { color: var(--ds-text-muted); }
.hdr .sp { flex: 1; }
.back { color: var(--ds-accent); text-decoration: none; padding: .3rem .5rem; border-radius: var(--ds-radius); }
.ibtn { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: var(--ds-radius); border: 1px solid var(--ds-border); background: rgba(255,255,255,.03); }
.btn { display: inline-flex; align-items: center; gap: .4rem; height: 2.1rem; padding: 0 .8rem; border-radius: var(--ds-radius); border: 1px solid var(--ds-border); background: rgba(255,255,255,.03); white-space: nowrap; }
.btn--primary { background: linear-gradient(180deg, #2a86d8, #1d6bb8); border-color: #3b8fe0; color: #fff; }
.btn--outline { border-color: var(--ds-accent); color: var(--ds-accent); }
.btn--sm { height: 1.8rem; padding: 0 .6rem; font-size: 12px; }
.state { font-size: 12px; color: var(--ds-success); }
.kind { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem; border-radius: 999px; font-size: 12px; border: 1px solid color-mix(in srgb, #fde047 55%, var(--ds-border)); background: linear-gradient(160deg, color-mix(in srgb, #fde047 22%, var(--ds-bg-panel)), var(--ds-bg-panel)); }

/* work */
.work { min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 21rem; overflow: hidden; }
.stage { min-height: 0; overflow: auto; }
.stage-bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; gap: .5rem; padding: .5rem .9rem; background: color-mix(in srgb, var(--ds-bg-page) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--ds-border); font-size: 12px; color: var(--ds-text-muted); }
.canvas { padding: 1.5rem 1rem 3rem; display: grid; justify-items: center; }
.mail { width: 100%; max-width: 600px; background: var(--m-page); padding: 1rem 0; border-radius: .25rem; box-shadow: 0 10px 30px rgba(0,0,0,.35); font: 16px/1.55 Georgia, serif; color: var(--m-body); }
.mb { margin: 0 auto; max-width: 560px; background: var(--m-content); padding: 20px 28px; position: relative; }
.mb + .mb { border-top: 1px solid var(--m-line); }
.mb.is-sel { outline: 2px solid var(--sel); outline-offset: -2px; }
.mb h2 { margin: 0 0 4px; color: var(--m-head); font: italic 600 26px/1.2 Georgia, serif; }
.mb .kick { font: 600 12px system-ui; letter-spacing: .08em; text-transform: uppercase; color: var(--m-accent); }
.mb--head { display: flex; justify-content: space-between; align-items: center; font: 600 14px system-ui; color: var(--m-head); }
.mb--foot { font: 12px system-ui; color: var(--m-dim); text-align: center; }
.mprice { text-align: center; display: grid; gap: 4px; justify-items: center; }
.mprice .chip { font: 600 12px system-ui; letter-spacing: .05em; text-transform: uppercase; background: var(--m-accent); color: var(--m-content); padding: .15rem .6rem; border-radius: 999px; }
.mprice .amount { color: var(--pb-amount, var(--m-head)); font: 700 40px/1 Georgia, serif; }
.mprice .amount small { font: 400 15px system-ui; color: var(--m-body); }
.mimg { display: flex; gap: 18px; align-items: center; }
.mimg .pic { flex: 0 0 40%; aspect-ratio: 4/3; border-radius: 4px; background: linear-gradient(135deg, #38618a, #1c3550); }
.mimg h3 { margin: 0 0 4px; color: var(--m-head); font: italic 600 20px Georgia, serif; }
.mbtn { display: inline-block; margin-top: 8px; padding: 8px 16px; border-radius: 4px; background: var(--m-btn); color: var(--m-btnText); font: 600 14px system-ui; }
.mcontact { display: flex; gap: 14px; align-items: center; font: 14px system-ui; }
.mcontact .av { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #5b7ea6, #2b4566); }

/* side panel */
.pane { min-height: 0; overflow: auto; overflow-x: hidden; background: var(--ds-bg-panel); border-inline-start: 1px solid var(--ds-border); }
.tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; padding: .5rem .5rem 0; background: var(--ds-bg-panel); border-bottom: 1px solid var(--ds-border); }
.tab { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: .45rem .1rem; border: 1px solid var(--ds-border); border-bottom: 0; border-radius: .4rem .4rem 0 0; background: rgba(255,255,255,.02); color: var(--ds-text-muted); font-size: 12px; position: relative; top: 1px; }
.tab[aria-selected="true"] { background: var(--ds-bg-panel); color: var(--ds-text); }
.tab .dot { position: absolute; top: .2rem; right: .2rem; width: .45rem; height: .45rem; border-radius: 50%; background: var(--ds-accent); }
.pane-body { padding: .7rem .7rem 1.2rem; display: grid; gap: .65rem; align-content: start; }
.ed-hint { margin: 0; font-size: 12px; color: var(--ds-text-muted); }

/* toggle built-in | own */
.toggle { display: flex; border: 1px solid var(--ds-border); border-radius: 999px; padding: 2px; background: rgba(255,255,255,.02); }
.toggle button { flex: 1; border: 0; background: none; padding: .35rem .5rem; border-radius: 999px; color: var(--ds-text-muted); font-size: 13px; }
.toggle button[aria-pressed="true"] { background: rgba(126,207,255,.16); color: var(--ds-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ds-accent) 45%, transparent); }
.toggle .cnt { display: inline-grid; place-items: center; min-width: 1.3rem; height: 1.2rem; margin-inline-start: .3rem; padding: 0 .3rem; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.08); }
.search { position: relative; }
.search input { width: 100%; padding: .4rem 1.8rem .4rem .55rem; border-radius: var(--ds-radius); border: 1px solid var(--ds-border); background: #081120; }
.search .x { position: absolute; right: .3rem; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--ds-text-muted); }
.legend { font-size: 11px; color: var(--ds-text-muted); display: flex; gap: .8rem; flex-wrap: wrap; }

/* catalog cards as in the app */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.card { --cat-a: var(--ds-accent); --cat-b: var(--ds-accent); --cat-ink: #0b1220; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; min-height: 5.6rem; border: 1px solid color-mix(in srgb, var(--cat-a) 40%, var(--ds-border)); border-radius: .5rem; padding: .6rem .55rem; text-align: start; background: linear-gradient(160deg, color-mix(in srgb, var(--cat-a) 18%, var(--ds-bg-panel)), var(--ds-bg-panel) 75%); cursor: grab; }
.card:hover { border-color: color-mix(in srgb, var(--cat-a) 70%, var(--ds-border)); }
.card__icon { position: relative; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: .4rem; font-size: 1rem; color: var(--cat-ink); background: linear-gradient(135deg, var(--cat-a), var(--cat-b)); }
.card--free .card__icon { background: repeating-linear-gradient(135deg, var(--cat-a) 0 5px, var(--cat-b) 5px 10px); color: #0b1220; }
.card__label { font-size: .8rem; font-weight: 700; color: var(--cat-a); padding-inline-end: 1rem; }
.card__hint { color: var(--ds-text-muted); font-size: .68rem; line-height: 1.3; padding-inline-end: 1.1rem; }
.card__drag { position: absolute; top: .45rem; right: .45rem; color: var(--ds-text-muted); font-size: 11px; }
.card__act { margin-top: auto; align-self: flex-end; font-size: 11px; padding: .1rem .5rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.25); }
.card__foot { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: .3rem; margin: auto -.55rem -.6rem; padding: .35rem .55rem; border-top: 1px solid color-mix(in srgb, var(--cat-a) 25%, transparent); border-radius: 0 0 calc(.5rem - 1px) calc(.5rem - 1px); font-size: .66rem; font-weight: 600; letter-spacing: .02em; color: color-mix(in srgb, var(--cat-a) 75%, var(--ds-text)); background: rgb(0 0 0 / 28%); }
.card__foot .card__act { margin: 0; }
.card__foot > span { white-space: nowrap; }
.own { display: inline-block; vertical-align: 1px; margin-inline-start: .25rem; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; padding: 0 .3rem; border-radius: 3px; background: rgba(255,255,255,.16); color: var(--ds-text); font-weight: 600; }
.own-dia { position: absolute; right: -.4rem; bottom: -.35rem; display: grid; place-items: center; width: 1rem; height: 1rem; border-radius: 50%; background: #e8f4ff; color: #0b1220; font-size: 9px; box-shadow: 0 0 0 2px var(--ds-bg-panel); }
.card--new { --cat-a: #9fb3c8; border-style: dashed; align-items: center; justify-content: center; text-align: center; cursor: pointer; background: rgba(255,255,255,.02); }
.card--new .card__icon { background: rgba(255,255,255,.08); color: var(--ds-text); }
.card--new .card__label { color: var(--ds-text); padding: 0; }
.card--new .card__hint { padding: 0; }
.empty-own { grid-column: 1 / -1; display: grid; gap: .45rem; padding: .8rem; border: 1px dashed var(--ds-border); border-radius: .5rem; font-size: 13px; color: var(--ds-text-muted); }
.empty-own b { color: var(--ds-text); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ds-accent); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }

/* placed list as in the app */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.pitem { --pl-a: #94a3b8; --pl-b: #475569; --pl-ink: #fff; border: 1px solid color-mix(in srgb, var(--pl-a) 35%, var(--ds-border)); border-radius: .5rem; background: linear-gradient(160deg, color-mix(in srgb, var(--pl-a) 12%, var(--ds-bg-panel)), var(--ds-bg-panel) 70%); }
.pitem.is-sel { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.prow { display: grid; grid-template-columns: auto auto 1fr auto; gap: .4rem; align-items: center; padding: .35rem .4rem; }
.handle { border: 0; background: none; color: var(--ds-text-muted); padding: 0 .1rem; cursor: grab; }
.picon { position: relative; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: .35rem; background: linear-gradient(135deg, var(--pl-a), var(--pl-b)); color: var(--pl-ink); font-size: 12px; }
.pitem--free .picon { background: repeating-linear-gradient(135deg, var(--pl-a) 0 4px, var(--pl-b) 4px 8px); }
.plabel { min-width: 0; font-size: 13px; }
.plabel small { display: block; font-size: 11px; color: var(--ds-text-muted); }
.pact { display: flex; gap: .2rem; }
.ed-btn { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: var(--ds-radius); border: 1px solid var(--ds-border); background: rgba(255,255,255,.03); font-size: 12px; }
.vchip { display: inline-flex; align-items: center; gap: .25rem; margin-inline-start: .3rem; padding: 0 .4rem; border-radius: 999px; font-size: 10px; font-weight: 600; border: 1px solid color-mix(in srgb, var(--ds-accent) 55%, var(--ds-border)); color: var(--ds-accent); background: rgba(126,207,255,.1); }
button.vchip { height: 1.2rem; }
.vnote { display: grid; gap: .4rem; margin: 0 .4rem .45rem; padding: .5rem .55rem; border-radius: .4rem; border: 1px solid color-mix(in srgb, var(--ds-accent) 45%, var(--ds-border)); background: rgba(126,207,255,.07); font-size: 12px; }
.vnote .acts { display: flex; gap: .4rem; flex-wrap: wrap; }
.vnote small { color: var(--ds-text-muted); }
.banner { display: grid; gap: .45rem; padding: .6rem .65rem; border-radius: .5rem; border: 1px solid color-mix(in srgb, var(--ds-accent) 45%, var(--ds-border)); background: rgba(126,207,255,.07); font-size: 13px; }
.banner .acts { display: flex; gap: .4rem; flex-wrap: wrap; }
.banner small { color: var(--ds-text-muted); font-size: 12px; }
.strip { display: flex; gap: .4rem; flex-wrap: wrap; padding: .1rem .45rem .5rem 2.6rem; }
.owncol { margin-inline-start: .3rem; font-size: 10px; color: var(--ds-text-muted); }
.chip-own { display: inline-flex; align-items: center; gap: .3rem; margin: 0 .4rem .45rem 2.6rem; font-size: 11px; color: var(--ds-text-muted); }

/* glass menu / popover */
.menu { position: absolute; right: .4rem; top: 2.3rem; z-index: 6; width: 15.5rem; border-radius: .6rem; overflow: hidden; background: var(--glass); backdrop-filter: blur(18px) saturate(140%); border: 1px solid var(--ds-border); box-shadow: 0 22px 48px -12px rgba(0,0,0,.65); font-size: 13px; }
.menu::before { content: ""; display: block; height: 1px; background: var(--glass-edge); }
.menu .h { padding: .5rem .7rem; background: var(--head-bg); font-size: 12px; }
.menu button { display: flex; gap: .55rem; align-items: center; width: 100%; padding: .45rem .7rem; border: 0; border-top: 1px solid var(--ds-border); background: none; text-align: start; }
.menu button:hover { background: rgba(126,207,255,.08); }
.menu .ti { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: .35rem; background: rgba(126,207,255,.14); color: var(--ds-accent); font-size: 12px; }
.menu .danger { color: var(--ds-danger); }
.menu .danger .ti { background: rgba(255,107,122,.14); color: var(--ds-danger); }
.rel { position: relative; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; padding: .6rem .7rem; }
.cmp figure { margin: 0; display: grid; gap: .25rem; font-size: 11px; color: var(--ds-text-muted); }
.cmp .mini { height: 3.6rem; border-radius: .3rem; border: 1px solid var(--ds-border); display: grid; place-items: center; font: 700 18px Georgia, serif; }
.menu .foot { display: flex; justify-content: flex-end; gap: .4rem; padding: .5rem .7rem .7rem; }
.menu .foot button { width: auto; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); padding: .25rem .6rem; }
.menu .foot .btn--primary { border-color: #3b8fe0; }

/* dialog */
.backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, rgba(126,207,255,.28), transparent 42%), rgba(4,8,16,.62); }
.dlg { width: min(32rem, calc(100vw - 2rem)); max-height: calc(100vh - 3rem); overflow: auto; border-radius: .6rem; background: var(--glass); backdrop-filter: blur(18px) saturate(140%); border: 1px solid var(--ds-border); box-shadow: 0 22px 48px -12px rgba(0,0,0,.65); }
.dlg-head { display: flex; align-items: center; gap: .6rem; padding: .8rem 1rem; background: var(--head-bg); color: #fff; }
.dlg-head .hi { display: inline-grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: .4rem; font-weight: 700; }
.hi--info { background: rgba(126,207,255,.25); color: var(--ds-accent); }
.hi--warn { background: rgba(245,184,74,.25); color: var(--ds-warning); }
.hi--danger { background: rgba(255,107,122,.25); color: var(--ds-danger); }
.dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg-x { width: 1.9rem; height: 1.9rem; border-radius: .35rem; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.14); color: #fff; }
.dlg-body { padding: 1rem; display: grid; gap: .8rem; font-size: 13px; }
.dlg-body p { margin: 0; }
.conseq { border: 1px solid var(--ds-border); border-radius: .45rem; padding: .6rem .7rem; background: rgba(255,255,255,.03); display: grid; gap: .3rem; }
.dlg-foot { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; padding: 0 1rem 1rem; }
.field { display: grid; gap: .25rem; }
.field label { font-size: 12px; color: var(--ds-text-muted); }
.field .help { font-size: 11px; color: var(--ds-text-muted); }
.check { display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: start; padding: .55rem .6rem; border-radius: .45rem; border: 1px solid var(--ds-border); background: rgba(255,255,255,.02); }
.check input { margin-top: .2rem; accent-color: #2a86d8; }
.check small { display: block; color: var(--ds-text-muted); font-size: 12px; }
.maprows { display: grid; gap: .35rem; }
.maprow { display: grid; grid-template-columns: 1.3rem 1fr auto; gap: .5rem; align-items: center; }
.sw { width: 1.3rem; height: 1.3rem; border-radius: .3rem; border: 1px solid rgba(255,255,255,.25); }
.maprow small { display: block; color: var(--ds-text-muted); font-size: 11px; }
.tag-role { font-size: 11px; color: var(--ds-accent); white-space: nowrap; }
.tag-fixed { font-size: 11px; padding: .05rem .4rem; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--ds-text) 45%, transparent); white-space: nowrap; }
.pick { display: grid; gap: .3rem; }
.pick label { display: grid; grid-template-columns: auto 1.1rem 1fr; gap: .5rem; align-items: center; padding: .4rem .55rem; border-radius: .4rem; border: 1px solid var(--ds-border); }
.pick .bar { width: .3rem; height: 1.1rem; border-radius: 2px; background: #fde047; }
.pick small { color: var(--ds-text-muted); }

/* snackbar */
.snack { position: fixed; left: 50%; bottom: 3.4rem; transform: translateX(-50%); z-index: 50; display: flex; gap: .8rem; align-items: center; padding: .55rem .6rem .55rem .9rem; border-radius: var(--ds-radius); background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--ds-border); border-inline-start: 3px solid var(--ds-success); box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); font-size: 13px; }
.snack--err { border-inline-start-color: var(--ds-danger); }

footer.ftr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 2.75rem; padding: 0 .9rem; font-size: 11px; letter-spacing: .08em; color: var(--ds-text-muted); background: var(--ds-bg-panel); border-top: 1px solid var(--ds-border); }
footer.ftr .links { display: flex; gap: 1rem; }
footer.ftr .ver { justify-self: end; letter-spacing: 0; }
@media (max-width: 52rem) { .work { grid-template-columns: 1fr; } .stage { display: none; } }
@media (prefers-reduced-motion: no-preference) { .snack { animation: rise .18s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, .4rem); } } }
</style>
</head>
<body>

<div class="mk" role="region" aria-label="Mockup-Steuerung">
  <span><b>Variante</b><span class="seg" data-k="v"><button data-v="A">A Schalter und Kennzeichen</button><button data-v="B">B Zähler und Sammelhinweis</button><button data-v="C">C Fußband und Vergleich</button></span></span>
  <span><b>Farbsatz</b><span class="seg" data-k="set"><button data-v="dark">Dunkel</button><button data-v="light">Hell</button></span></span>
  <label><input type="checkbox" id="showNew"> Neues gelb umranden</label>
  <span><b>Szene</b><span class="seg" data-k="sc">
    <button data-v="built">Mitgeliefert</button><button data-v="own">Eigene</button><button data-v="empty">Eigene leer</button><button data-v="update">Neue Version</button><button data-v="save">Als eigenen speichern</button><button data-v="saveDlg">Dialog Speichern</button><button data-v="replace">Dialog Alle ersetzen</button><button data-v="full">Speicher voll</button>
  </span></span>
  <span id="originCtl"><b>Herkunft</b><span class="seg" data-k="origin"><button data-v="tile">Kachel „Anpassen“</button><button data-v="warn">Hinweis im Tab „Farben“</button></span></span>
  <a href="r2-colors.html" style="color:#fff">Zu Schritt 4 Farben →</a>
  <span class="note" id="mknote"></span>
</div>

<header class="hdr" id="hdr"></header>
<main class="work" id="work"></main>
<footer class="ftr"><span></span><span class="links"><span>STARTSEITE</span><span>IMPRESSUM</span><span>DATENSCHUTZ</span><span>ÜBER</span></span><span class="ver">v0.4.7</span></footer>
<div id="overlay"></div>

<script>
const S = { v: 'A', set: 'dark', sc: 'own', origin: 'tile', showNew: true, list: 'own', menu: false, pop: false, dlg: false, updated: {}, snack: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('mk-r2-panel') || '{}'), { menu: false, pop: false, dlg: false, snack: '', updated: {} }); } catch {}

const HUE = {
  hero: ['#fb923c', '#ea580c', '#0b1220', '✨', 'Hero', 'Label und große Überschrift'],
  paragraph: ['#60a5fa', '#1d4ed8', '#fff', 'Aa', 'Absatz', 'Fließtext für einen Abschnitt'],
  'image-text': ['#fb7185', '#9f1239', '#fff', '◧', 'Bild und Text', 'Bild neben Text'],
  'price-box': ['#fde047', '#ca8a04', '#0b1220', '€', 'Preisbox', 'Angebot mit Preis'],
  'cta-button': ['#22d3ee', '#0e7490', '#0b1220', '▶', 'Button', 'Ein klarer Aktions-Button'],
  contact: ['#a78bfa', '#5b21b6', '#fff', '☎', 'Ansprechpartner', 'Foto, Name, Kontakt'],
  event: ['#fdba74', '#c2410c', '#0b1220', '📅', 'Termin', 'Datum, Ort, Kalender'],
  divider: ['#94a3b8', '#475569', '#fff', '—', 'Trenner', 'Linie oder Abstand'],
  free: ['#a3b8cc', '#52677d', '#0b1220', '◆', 'Freier Baustein', ''],
};
const OWN = [
  { id: 'pbf', type: 'price-box', name: 'Preisbox Frühjahr', from: 'Kopie von Preisbox', ver: 3, changed: 'heute' },
  { id: 'kk', type: 'contact', name: 'Kontakt kompakt', from: 'Kopie von Ansprechpartner', ver: 2, changed: 'gestern' },
  { id: 'bma', type: 'free', name: 'Bild mit Angebot', from: 'Freier Baustein', ver: 1, changed: '12. Okt.' },
];
const SETS = {
  dark: { page: '#08101e', content: '#0c1628', body: '#a9c0d6', head: '#d8eeff', dim: '#6b88a6', accent: '#f5c518', btn: '#1d6bb8', btnText: '#ffffff', line: '#1e3a5c' },
  light: { page: '#e9eff6', content: '#ffffff', body: '#3b4f63', head: '#0c1d33', dim: '#56697c', accent: '#8a6200', btn: '#1d6bb8', btnText: '#ffffff', line: '#d5dee8' },
};
const NOTES = {
  A: 'A: Schalter „Mitgeliefert | Eigene“ ohne Zahlen. Eigene Bausteine: Farbton der Ursprungsart plus Schildchen „eigen“ am Namen. Neue Version: Hinweis direkt unter der Zeile. „Als eigenen Baustein speichern“ im neuen Menü ⋯ der Zeile.',
  B: 'B: Schalter mit Anzahl. Eigene Bausteine: kleine Raute ◆ am Symbol. Neue Version: ein Sammelhinweis oben mit „Alle aktualisieren“, an der Zeile nur „V2 → V3“. „Als eigenen Baustein speichern“ erscheint nur bei Bausteinen mit eigenen Farben, direkt unter der Zeile.',
  C: 'C: Schalter mit Anzahl und Suche. Eigene Bausteine: Fußband „◆ Eigen · Version“ wie das heutige Kartenband. Neue Version: Chip „V3 neu“ öffnet einen Vergleich. „Als eigenen Baustein speichern“ in einer Aktionsleiste unter der gewählten Zeile.',
};
const SCN = {
  built: 'Tab „Alle“, Liste „Mitgeliefert“: nur die Bausteine, die mit der App kommen (Entscheidung 32). „Anpassen“ legt eine Kopie an.',
  own: 'Tab „Alle“, Liste „Eigene“: Kachel „Neuer Baustein“ zuerst (48). Kopien tragen den Farbton ihrer Ursprungsart, freie Bausteine einen gemeinsamen neutralen Ton mit Streifen, alle mit festem Kennzeichen „eigen“.',
  empty: 'Liste „Eigene“ ohne Einträge: Kachel „Neuer Baustein“, kurzer Weg zu „Anpassen“ und Öffnen aus einer Datei (Entscheidung 16).',
  update: 'Tab „Aktuelle Bausteine“: zwei eingefügte eigene Bausteine haben eine neuere Version. Nichts ändert sich ohne Klick (Entscheidung 2). „Aktualisieren“ zeigt danach 8 Sekunden „Rückgängig“.',
  save: 'Tab „Aktuelle Bausteine“: die Preisbox hat 3 eigene Farben. Klick auf die markierte Stelle öffnet den Dialog.',
  saveDlg: 'Dialog „Als eigenen Baustein speichern“: Farben gleich einer allgemeinen Farbe werden Rollen, alle anderen fest (Entscheidung 34).',
  replace: 'Block-Editor, nach dem ersten Speichern einer Kopie. Von der Kachel „Anpassen“ ist das Ersetzen aus (49), vom Hinweis im Tab „Farben“ an (33). Oben „Herkunft“ umschalten.',
  full: 'Fehlerfall beim Speichern: Browser-Speicher voll. Nichts geht verloren, solange die Seite offen ist.',
};

const isOwnList = () => ['own', 'empty'].includes(S.sc);
const esc = (s) => s;

function seg() {
  document.querySelectorAll('.mk .seg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
  document.getElementById('mknote').innerHTML = `${NOTES[S.v]}<br><b>Szene:</b> ${SCN[S.sc]}`;
  document.getElementById('originCtl').style.display = S.sc === 'replace' ? '' : 'none';
  document.getElementById('showNew').checked = S.showNew;
  document.body.classList.toggle('hide-new', !S.showNew);
}

function header() {
  const h = document.getElementById('hdr');
  if (S.sc === 'replace') {
    h.innerHTML = `<a class="back" href="#">← Zurück zu „Frühjahrsangebot 2027“</a>
      <b style="font-size:15px">Preisbox Frühjahr</b><span class="kind">Kopie von „Preisbox“ <span class="own">eigen</span></span><span class="state">✓ Gespeichert · Version 1</span>
      <span class="sp"></span><button class="ibtn">↶</button><button class="ibtn">↷</button><button class="btn btn--outline">Entwurf speichern</button><button class="btn btn--primary">Neue Version speichern</button><button class="ibtn">⋮</button><button class="btn">🌐 DE</button>`;
    return;
  }
  h.innerHTML = `<span class="brand">⌂ Newsletter-Editor</span><span class="doc">· Frühjahrsangebot 2027</span><span class="sp"></span>
    <button class="ibtn">↶</button><button class="ibtn">↷</button><button class="btn btn--primary">Speichern</button><button class="btn">HTML exportieren</button><button class="ibtn">⋮</button><button class="btn">🌐 DE</button>`;
}

function mailVars() {
  const c = SETS[S.set];
  return `--m-page:${c.page};--m-content:${c.content};--m-body:${c.body};--m-head:${c.head};--m-dim:${c.dim};--m-accent:${c.accent};--m-btn:${c.btn};--m-btnText:${c.btnText};--m-line:${c.line}`;
}

function mail() {
  const selPb = ['save', 'saveDlg'].includes(S.sc);
  const pbOwn = S.sc === 'save' || S.sc === 'saveDlg' ? (S.set === 'dark' ? '#fb923c' : '#c2410c') : '';
  const price = (sel, chip, amt) => `<div class="mb ${sel ? 'is-sel' : ''}" ${pbOwn && sel ? `style="--pb-amount:${pbOwn}"` : ''}><div class="mprice"><span class="chip">${chip}</span><span class="amount">${amt} <small>pro Person</small></span><span style="font:14px system-ui">3 Nächte mit Frühstück</span></div></div>`;
  if (S.sc === 'replace') {
    return `<div class="mail" style="${mailVars()}"><div class="mb" style="opacity:.5;font:12px system-ui;text-align:center">… Baustein davor …</div>${price(true, 'Frühbucher', '149 €')}<div class="mb" style="opacity:.5;font:12px system-ui;text-align:center">… Baustein danach …</div></div>`;
  }
  return `<div class="mail" style="${mailVars()}">
    <div class="mb mb--head"><span>CloudLib</span><span style="font-weight:400;color:var(--m-dim)">Newsletter Frühjahr</span></div>
    <div class="mb"><div class="kick">Neu im Frühjahr</div><h2>Auszeit am See</h2><p style="margin:0">Unsere schönsten Angebote für Kurzurlaube bis Ende April.</p></div>
    ${price(selPb, 'Frühbucher', '149 €')}
    <div class="mb"><div class="mimg"><div class="pic"></div><div><h3>Frühjahr am See</h3><div style="font-size:14px">Drei Nächte mit Seeblick.</div><span class="mbtn">Angebot ansehen</span></div></div></div>
    <div class="mb"><div class="mcontact"><span class="av"></span><div><b style="color:var(--m-head)">Alex Berger</b><br>Ihr Ansprechpartner · +49 30 1234567</div></div></div>
    <div class="mb mb--foot">Impressum · Abmelden</div>
  </div>`;
}

function tabs(on) {
  const T = [['placed', 'Aktuell'], ['catalog', 'Alle'], ['campaign', 'Kampagne'], ['brand', 'Marke'], ['colors', 'Farben'], ['legal', 'Legal'], ['social', 'Social']];
  const dot = (id) => id === 'placed' && S.sc === 'update' && S.v === 'B' ? '<span class="dot" title="Neue Versionen"></span>' : '';
  return `<div class="tabs" role="tablist">${T.map(([id, t]) => `<button class="tab" role="tab" aria-selected="${id === on}">${t}${dot(id)}</button>`).join('')}</div>`;
}

function hueVars(type) { const h = HUE[type]; return `--cat-a:${h[0]};--cat-b:${h[1]};--cat-ink:${h[2]}`; }
function plVars(type) { const h = HUE[type]; return `--pl-a:${h[0]};--pl-b:${h[1]};--pl-ink:${h[2]}`; }

function builtCard(type, adjust) {
  const h = HUE[type];
  return `<div class="card" style="${hueVars(type)}" draggable="true" title="In die Vorschau ziehen zum Einfügen"><span class="card__icon">${h[3]}</span><span class="card__label">${h[4]}</span><span class="card__hint">${h[5]}</span><span class="card__drag">⋮⋮</span>${adjust ? '<button class="card__act">Anpassen</button>' : ''}</div>`;
}

function ownCard(o) {
  const h = HUE[o.type];
  const free = o.type === 'free' ? 'card--free' : '';
  if (S.v === 'A') {
    return `<div class="card ${free}" style="${hueVars(o.type)}" draggable="true"><span class="card__icon">${h[3]}</span><span class="card__label">${o.name}<span class="own is-new">eigen</span></span><span class="card__hint">${o.from} · Version ${o.ver}</span><span class="card__drag">⋮⋮</span><button class="card__act">Bearbeiten</button></div>`;
  }
  if (S.v === 'B') {
    return `<div class="card ${free}" style="${hueVars(o.type)}" draggable="true"><span class="card__icon">${h[3]}<span class="own-dia is-new" aria-label="eigener Baustein">◆</span></span><span class="card__label">${o.name}</span><span class="card__hint">${o.from} · V${o.ver}</span><span class="card__drag">⋮⋮</span><button class="card__act">Bearbeiten</button></div>`;
  }
  return `<div class="card ${free}" style="${hueVars(o.type)}" draggable="true"><span class="card__icon">${h[3]}</span><span class="card__label">${o.name}</span><span class="card__hint">${o.from}</span><span class="card__drag">⋮⋮</span><span class="card__foot is-new"><span>◆ EIGEN · V${o.ver}</span><button class="card__act">Bearbeiten</button></span></div>`;
}

function newTile() {
  return `<button class="card card--new is-new"><span class="card__icon">＋</span><span class="card__label">Neuer Baustein</span><span class="card__hint">aus Teilen bauen</span></button>`;
}

function catalog() {
  const own = isOwnList();
  const cnt = (n) => S.v === 'A' ? '' : `<span class="cnt">${n}</span>`;
  const nOwn = S.sc === 'empty' ? 0 : OWN.length;
  const toggle = `<div class="toggle is-new" role="group" aria-label="Bausteine filtern"><button data-list="built" aria-pressed="${!own}">Mitgeliefert${cnt(18)}</button><button data-list="own" aria-pressed="${own}">Eigene${cnt(nOwn)}</button></div>`;
  const hint = own
    ? '<p class="ed-hint">Ihre eigenen Bausteine, für alle Vorlagen. Karte in die Vorschau ziehen wie bei den mitgelieferten.</p>'
    : '<p class="ed-hint">Karte in die E-Mail-Vorschau ziehen und dort ablegen, wo sie hin soll. „Anpassen“ legt eine eigene Kopie an.</p>';
  if (!own) {
    return `${hint}${toggle}<div class="grid">${['hero', 'paragraph', 'image-text', 'price-box', 'cta-button', 'contact', 'event', 'divider'].map((t) => builtCard(t, true)).join('')}</div>`;
  }
  const search = S.v === 'C' && nOwn ? '<div class="search is-new"><input placeholder="Eigene Bausteine suchen" aria-label="Eigene Bausteine suchen"><button class="x" aria-label="Leeren">×</button></div>' : '';
  const legend = S.v === 'B' && nOwn ? '<div class="legend"><span>◆ = eigener Baustein</span><span>Streifen = freier Baustein</span></div>' : '';
  const sort = nOwn ? '<div class="legend"><span>Zuletzt geändert zuerst</span></div>' : '';
  if (S.sc === 'empty') {
    return `${hint}${toggle}<div class="grid">${newTile()}
      <div class="empty-own"><b>Noch keine eigenen Bausteine.</b><span>Bauen Sie einen neuen aus Teilen, oder wählen Sie bei einem mitgelieferten Baustein „Anpassen“.</span><span><button class="linkbtn" data-list="built">Zu „Mitgeliefert“</button> · <button class="linkbtn">Aus Datei öffnen …</button></span></div></div>`;
  }
  return `${hint}${toggle}${search}${legend}${sort}<div class="grid">${newTile()}${OWN.map(ownCard).join('')}</div>`;
}

function placedRow(i, p) {
  const h = HUE[p.type];
  const own = p.own;
  const free = p.type === 'free' ? 'pitem--free' : '';
  let mark = '';
  if (own && S.v === 'A') mark = '<span class="own">eigen</span>';
  const dia = own && S.v === 'B' ? '<span class="own-dia">◆</span>' : '';
  const ownC = own && S.v === 'C' ? '<span class="own">◆ eigen</span>' : '';
  let ver = own ? `<small>${p.from} · Version ${p.ver}</small>` : (p.hint ? `<small>${p.hint}</small>` : '');
  let extra = '';
  const upd = p.newer && !S.updated[p.id] && S.sc === 'update';
  if (S.updated[p.id]) ver = `<small>${p.from} · Version ${p.newer}</small>`;
  if (upd && S.v === 'A') {
    extra = `<div class="vnote is-new" role="note"><span>Neue Version ${p.newer} von „${p.name}“ ist da. Sie nutzen Version ${p.ver}.</span><small>Ihre Texte bleiben. Aufbau und Farben kommen aus Version ${p.newer}.</small><span class="acts"><button class="btn btn--sm btn--primary" data-upd="${p.id}">Aktualisieren</button><button class="btn btn--sm" data-later="${p.id}">Später</button></span></div>`;
  }
  if (upd && S.v === 'B') ver = `<small>${p.from} <span class="vchip is-new">V${p.ver} → V${p.newer}</span></small>`;
  if (upd && S.v === 'C') ver = `<small>${p.from} · Version ${p.ver} <button class="vchip is-new" data-pop="${p.id}">V${p.newer} neu</button></small>`;
  if (upd && S.v === 'C' && S.pop === p.id) {
    extra = `<div class="rel"><div class="menu" style="top:-.3rem;right:.4rem;left:.4rem;width:auto" role="dialog" aria-label="Versionen vergleichen"><div class="h">„${p.name}“: Version ${p.ver} oder ${p.newer}?</div>
      <div class="cmp"><figure><div class="mini" style="color:#d8eeff">149 €</div><figcaption>Ihre Version ${p.ver}</figcaption></figure><figure><div class="mini" style="color:#fb923c;border-color:var(--ds-accent)">149 €</div><figcaption>Neu: Version ${p.newer} · größerer Preis, Akzent fest</figcaption></figure></div>
      <div style="padding:0 .7rem;font-size:12px;color:var(--ds-text-muted)">Ihre Texte bleiben. Aufbau und Farben kommen aus Version ${p.newer}.</div>
      <div class="foot"><button data-pop="">Behalten</button><button class="btn--primary" style="background:linear-gradient(180deg,#2a86d8,#1d6bb8);color:#fff" data-upd="${p.id}">Aktualisieren</button></div></div></div>`;
  }
  const isSave = ['save', 'saveDlg'].includes(S.sc) && p.id === 'pb';
  const ownColors = p.ownColors ? `<span class="owncol">● ${p.ownColors} eigene Farben</span>` : '';
  let saveUi = '';
  if (isSave && S.v === 'B') saveUi = `<div class="chip-own">● 3 eigene Farben · <button class="linkbtn is-new" data-dlg="save">Als eigenen Baustein speichern</button></div>`;
  if (isSave && S.v === 'C') saveUi = `<div class="strip is-new"><button class="btn btn--sm" data-dlg="save">◆ Als eigenen Baustein speichern</button><button class="btn btn--sm">Farben ansehen</button></div>`;
  const more = S.v === 'A' ? `<button class="ed-btn ${isSave ? 'is-new' : ''}" aria-label="Weitere Aktionen" data-menu="${p.id}">⋯</button>` : '';
  const menu = S.v === 'A' && S.menu === p.id ? `<div class="menu" role="menu"><button role="menuitem"><span class="ti">✎</span>Inhalt bearbeiten</button><button role="menuitem" data-dlg="save" class="is-new"><span class="ti">◆</span>Als eigenen Baustein speichern</button>${own ? '<button role="menuitem"><span class="ti">↗</span>Im Block-Editor öffnen</button>' : ''}<button role="menuitem" class="danger"><span class="ti">✕</span>Entfernen</button></div>` : '';
  return `<li class="pitem ${free} ${isSave && S.v === 'C' ? 'is-sel' : ''}" style="${plVars(p.type)}">
    <div class="prow rel"><button class="handle" aria-label="Ziehen zum Umsortieren">⋮⋮</button><span class="picon">${h[3]}${dia}</span>
      <span class="plabel"><b style="font-weight:500">${i}</b> ${own ? p.name : h[4]}${mark}${ownC}${S.v !== 'B' || !isSave ? ownColors : ''}${ver}</span>
      <span class="pact"><button class="ed-btn" aria-label="Bearbeiten">✎</button>${S.v === 'A' ? '' : '<button class="ed-btn" aria-label="Nach oben">↑</button><button class="ed-btn" aria-label="Nach unten">↓</button>'}${more}${S.v === 'A' ? '' : '<button class="ed-btn" aria-label="Entfernen">✕</button>'}</span>${menu}</div>
    ${extra}${saveUi}</li>`;
}

function placed() {
  const rows = [
    { id: 'hero', type: 'hero' },
    { id: 'pb', type: S.sc === 'update' ? 'price-box' : 'price-box', own: S.sc === 'update', name: 'Preisbox Frühjahr', from: 'Kopie von Preisbox', ver: 2, newer: 3, ownColors: S.sc !== 'update' ? 3 : 0 },
    { id: 'bma', type: 'free', own: true, name: 'Bild mit Angebot', from: 'Freier Baustein', ver: 1 },
    { id: 'kk', type: 'contact', own: true, name: 'Kontakt kompakt', from: 'Kopie von Ansprechpartner', ver: 1, newer: 2 },
  ];
  if (S.sc !== 'update') { rows[3] = { id: 'ct', type: 'contact' }; }
  const pending = rows.filter((r) => r.newer && r.own && !S.updated[r.id]).length;
  const banner = S.v === 'B' && S.sc === 'update' && pending
    ? `<div class="banner is-new" role="note"><span><b>${pending === 2 ? 'Zwei eigene Bausteine haben' : 'Ein eigener Baustein hat'} eine neue Version.</b></span><small>Ihre Texte bleiben. Aufbau und Farben kommen aus der neuen Version. Andere Vorlagen ändern sich nicht.</small><span class="acts"><button class="btn btn--sm btn--primary" data-upd="all">Alle aktualisieren</button><button class="btn btn--sm">Einzeln ansehen</button></span></div>` : '';
  return `<p class="ed-hint">Bausteine in dieser E-Mail, von oben nach unten. Mit ⋮⋮ ziehen zum Umsortieren.</p>${banner}<ul class="plist">${rows.map((r, i) => placedRow(i + 1, r)).join('')}</ul>`;
}

function panel() {
  const tab = ['built', 'own', 'empty'].includes(S.sc) ? 'catalog' : 'placed';
  if (S.sc === 'replace') {
    return `<aside class="pane"><div class="tabs"><button class="tab">Teile</button><button class="tab" aria-selected="true">Eigenschaften</button><button class="tab">Prüfung</button></div><div class="pane-body"><p class="ed-hint">Starttexte, Layout und Farben der Kopie (Mockup R1, Schritt 2).</p></div></aside>`;
  }
  return `<aside class="pane">${tabs(tab)}<div class="pane-body">${tab === 'catalog' ? catalog() : placed()}</div></aside>`;
}

function dialog() {
  if (S.sc === 'saveDlg' || S.dlg === 'save') {
    const c = SETS[S.set];
    return `<div class="backdrop" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dlg">
      <div class="dlg-head"><span class="hi hi--info">◆</span><h2 id="dT">Als eigenen Baustein speichern</h2><button class="dlg-x" aria-label="Schließen" data-close>×</button></div>
      <div class="dlg-body">
        <div class="field"><label for="nm">Name</label><div class="search"><input id="nm" value="Preisbox Frühjahr"><button class="x" aria-label="Leeren">×</button></div><span class="help">So heißt er unter „Alle › Eigene“.</span></div>
        <div class="field"><label>So werden die Farben übernommen</label><div class="maprows">
          <div class="maprow"><span class="sw" style="background:${c.accent}"></span><span>Hinweis oben<small>gleich der allgemeinen Farbe „Akzent“</small></span><span class="tag-role">folgt „Akzent“</span></div>
          <div class="maprow"><span class="sw" style="background:${c.content}"></span><span>Hintergrund<small>gleich „Inhaltsfläche“</small></span><span class="tag-role">folgt „Inhaltsfläche“</span></div>
          <div class="maprow"><span class="sw" style="background:${S.set === 'dark' ? '#fb923c' : '#c2410c'}"></span><span>Betrag<small>eigene Farbe ${S.set === 'dark' ? '#FB923C' : '#C2410C'}</small></span><span class="tag-fixed">fest</span></div>
          <div class="maprow"><span class="sw" style="background:#9aa7b4"></span><span>Kleingedruckt<small>eigene Farbe #9AA7B4</small></span><span class="tag-fixed">fest</span></div>
        </div></div>
        <div class="conseq"><span><b>Folgt:</b> passt sich in jeder Vorlage deren Farben an.</span><span><b>Fest:</b> bleibt in jeder Vorlage gleich. Im Block-Editor können Sie das ändern.</span><span>Es gelten beide Farbsätze, Hell und Dunkel.</span></div>
        <label class="check"><input type="checkbox" checked><span>Diese Preisbox durch den eigenen Baustein ersetzen<small>Sie sieht danach gleich aus, die 3 eigenen Farben stehen dann im eigenen Baustein.</small></span></label>
      </div>
      <div class="dlg-foot"><button class="btn" data-close>Abbrechen</button><button class="btn" data-close>Speichern und öffnen</button><button class="btn btn--primary" data-close data-snack="„Preisbox Frühjahr“ unter „Alle › Eigene“ gespeichert.">Speichern</button></div>
    </div></div>`;
  }
  if (S.sc === 'replace') {
    const on = S.origin === 'warn';
    const conseq = `<div class="conseq"><span>Texte und Bilder der ersetzten Preisboxen bleiben.</span><span>Einzelne Farbänderungen in diesen Preisboxen entfallen. Es gelten die Farben der Kopie.</span><span>Nur diese Vorlage. Rückgängig im Editor mit ↶.</span></div>`;
    const why = on
      ? '<p>Sie kommen vom Hinweis im Tab „Farben“. Deshalb ist Ersetzen vorgewählt.</p>'
      : '<p>Sie kommen von „Anpassen“ in „Alle Bausteine“. Die Kopie steht ab jetzt unter „Alle › Eigene“.</p>';
    let body = '', foot = '';
    if (S.v === 'A') {
      body = `<label class="check is-new"><input type="checkbox" ${on ? 'checked' : ''}><span>Alle 3 Preisboxen in „Frühjahrsangebot 2027“ durch „Preisbox Frühjahr“ ersetzen</span></label>${conseq}`;
      foot = '<button class="btn" data-close>Abbrechen</button><button class="btn btn--primary" data-close>Fertig</button>';
    } else if (S.v === 'B') {
      const it = (n, t, own) => `<label><input type="checkbox" ${on ? 'checked' : ''}><span class="bar"></span><span>Baustein ${n}: ${t}${own ? ` <small>· ${own}</small>` : ''}</span></label>`;
      body = `<div class="field is-new"><label>Welche Preisboxen in „Frühjahrsangebot 2027“ ersetzen?</label><div class="pick">${it(2, '149 € · Frühbucher', '3 eigene Farben')}${it(5, '99 € · Wochenende', '')}${it(7, '249 € · Familie', '1 eigene Farbe')}</div><button class="linkbtn" style="justify-self:start">Alle wählen</button></div>${conseq}`;
      foot = '<button class="btn" data-close>Abbrechen</button><button class="btn btn--primary" data-close>Übernehmen</button>';
    } else {
      body = `<p class="is-new">In „Frühjahrsangebot 2027“ gibt es 3 Preisboxen. Sollen alle die Kopie verwenden?</p>${conseq}`;
      foot = on
        ? '<button class="btn" data-close>Abbrechen</button><button class="btn" data-close>Nur speichern</button><button class="btn btn--primary" data-close>Alle ersetzen</button>'
        : '<button class="btn" data-close>Abbrechen</button><button class="btn" data-close>Alle ersetzen</button><button class="btn btn--primary" data-close>Nur speichern</button>';
    }
    return `<div class="backdrop" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dlg">
      <div class="dlg-head"><span class="hi hi--info">i</span><h2 id="dT">Kopie gespeichert. Preisboxen ersetzen?</h2><button class="dlg-x" aria-label="Schließen" data-close>×</button></div>
      <div class="dlg-body">${why}${body}</div><div class="dlg-foot">${foot}</div></div></div>`;
  }
  if (S.sc === 'full') {
    return `<div class="backdrop" role="alertdialog" aria-modal="true" aria-labelledby="dT"><div class="dlg">
      <div class="dlg-head"><span class="hi hi--danger">!</span><h2 id="dT">Speicher voll</h2><button class="dlg-x" aria-label="Schließen" data-close>×</button></div>
      <div class="dlg-body"><p>„Preisbox Frühjahr“ wurde nicht gespeichert. Der Browser hat für diese App keinen Platz mehr.</p>
        <div class="conseq"><span>Ihre Änderungen sind noch da, solange diese Seite offen ist.</span><span><b>Als Datei speichern:</b> sichert den Baustein auf Ihrem Rechner, kostenlos.</span><span><b>Aufräumen:</b> öffnet die Übersicht der eigenen Bausteine und Entwürfe.</span></div></div>
      <div class="dlg-foot"><button class="btn" data-close>Schließen</button><button class="btn" data-close>Aufräumen</button><button class="btn btn--primary" data-close>Als Datei speichern</button></div></div></div>`;
  }
  return '';
}

function render() {
  seg(); header();
  document.getElementById('work').innerHTML = `<section class="stage" aria-label="Vorschau"><div class="stage-bar"><span>Vorschau</span><span>Farbsatz „${S.set === 'dark' ? 'Dunkel' : 'Hell'}“ dieser Vorlage</span></div><div class="canvas">${mail()}</div></section>${panel()}`;
  document.getElementById('overlay').innerHTML = dialog() + (S.snack ? `<div class="snack" role="status">${S.snack}${S.snackUndo ? ' <button class="btn btn--sm" data-undo>Rückgängig</button>' : ''}<button class="ed-btn" aria-label="Schließen" data-unsnack>×</button></div>` : '');
  try { localStorage.setItem('mk-r2-panel', JSON.stringify(S)); } catch {}
}

let snackTimer;
function snack(t, undo) { S.snack = t; S.snackUndo = undo; clearTimeout(snackTimer); snackTimer = setTimeout(() => { S.snack = ''; render(); }, 8000); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t) { if (S.menu) { S.menu = false; render(); } return; }
  if (t.tagName === 'A') { if (t.getAttribute('href') !== '#') return; e.preventDefault(); }
  const g = t.closest('.mk .seg');
  if (g) { S[g.dataset.k] = t.dataset.v; S.menu = false; S.pop = false; S.dlg = false; S.updated = {}; S.snack = ''; render(); return; }
  if (t.dataset.list) { S.sc = t.dataset.list === 'own' ? 'own' : 'built'; render(); return; }
  if (t.dataset.menu) { S.menu = S.menu === t.dataset.menu ? false : t.dataset.menu; render(); return; }
  if (t.dataset.pop !== undefined) { S.pop = t.dataset.pop || false; render(); return; }
  if (t.dataset.upd) {
    if (t.dataset.upd === 'all') { S.updated = { pb: true, kk: true }; snack('Zwei Bausteine auf die neue Version aktualisiert.', true); }
    else { S.updated[t.dataset.upd] = true; snack(`„${t.dataset.upd === 'pb' ? 'Preisbox Frühjahr' : 'Kontakt kompakt'}“ auf die neue Version aktualisiert.`, true); }
    S.pop = false; render(); return;
  }
  if (t.dataset.later) { S.updated[t.dataset.later] = true; snack('Hinweis ausgeblendet, bis eine weitere Version kommt.', false); render(); return; }
  if (t.hasAttribute('data-undo')) { S.updated = {}; S.snack = ''; render(); return; }
  if (t.hasAttribute('data-unsnack')) { S.snack = ''; render(); return; }
  if (t.dataset.dlg) { S.dlg = t.dataset.dlg; S.menu = false; render(); return; }
  if (t.hasAttribute('data-close')) {
    if (t.dataset.snack) snack(t.dataset.snack, false);
    S.dlg = false; if (['saveDlg', 'replace', 'full'].includes(S.sc)) S.sc = S.sc === 'replace' || S.sc === 'full' ? S.sc : 'save';
    if (S.sc === 'replace' || S.sc === 'full') document.getElementById('overlay').querySelector('.backdrop')?.remove(); else render();
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'showNew') { S.showNew = e.target.checked; render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.menu = false; S.pop = false; S.dlg = false; if (S.sc === 'saveDlg') S.sc = 'save'; render(); } });
render();
</script>
</body>
</html>
