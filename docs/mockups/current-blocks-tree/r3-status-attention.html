<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statuszeile Hinweis</title>
<style>
/* Layout: a slice of the Current blocks tree with its status line; three ways to draw the eye to the status line. Tokens from src/styles.scss. */
:root {
  color-scheme: dark;
  --ds-bg-page: #060b14; --ds-bg-panel: #0c1628; --ds-border: #1a3050; --ds-accent: #7ecfff;
  --ds-text: #e8f4ff; --ds-text-muted: #7a9ab8; --ds-warning: #f5b84a;
  --ds-radius: .25rem;
  --head-bg: linear-gradient(180deg, rgba(255,255,255,.12), transparent 42%), linear-gradient(120deg, #0a1830 0%, #123a5c 48%, #0c5a78 100%);
  --line: rgba(122,154,184,.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ds-text); background: var(--ds-bg-page); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ds-accent); outline-offset: 1px; }

.mk { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; align-items: center; padding: .45rem max(16px, env(safe-area-inset-right, 0px)) .45rem max(16px, env(safe-area-inset-left, 0px)); background: #2a1d05; border-bottom: 1px dashed #8a6a20; color: #f3d9a0; font-size: 12px; }
.mk b { font-weight: 600; margin-inline-end: .3rem; }
.mk .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #8a6a20; border-radius: .8rem; overflow: hidden; }
.mk .seg button { background: none; border: 0; padding: .2rem .6rem; color: #f3d9a0; }
.mk .seg button[aria-pressed="true"] { background: #8a6a20; color: #fff; }
.mk label { display: inline-flex; gap: .3rem; align-items: center; }
.mk .note { flex: 1 1 100%; color: #d8b870; line-height: 1.45; }

.wrap { display: grid; justify-items: center; padding: 1.2rem max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); }
.panel { width: min(100%, 34rem); border: 1px solid var(--ds-border); border-radius: .5rem; overflow: hidden; background: color-mix(in srgb, var(--ds-bg-panel) 78%, transparent); display: grid; grid-template-rows: auto 1fr auto; min-height: 26rem; }
.hint { margin: 0; padding: .6rem .75rem .3rem; font-size: 11.5px; color: var(--ds-text-muted); }

/* simplified org chart */
.tree { position: relative; padding: .6rem .9rem 1.2rem; }
.tree svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; fill: none; stroke: var(--line); stroke-linecap: round; }
.root { position: relative; z-index: 1; margin: 0 auto; width: max-content; padding: .35rem .75rem; border-radius: .55rem; font-size: 12.5px; font-weight: 600; background: var(--head-bg); border: 1px solid rgba(255,255,255,.18); }
.cols { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.3rem; flex-wrap: wrap; }
.col { display: grid; gap: .25rem; justify-items: start; align-content: start; }
.col ul { list-style: none; margin: .35rem 0 0; padding: 0 0 0 1rem; display: grid; gap: .25rem; }
.node { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: .3rem; min-height: 1.6rem; padding: .1rem .4rem .1rem .25rem; border: 1px solid transparent; border-radius: .45rem; font-size: 12px; background: color-mix(in srgb, var(--ds-bg-panel) 94%, transparent); }
.node:hover { border-color: color-mix(in srgb, var(--ds-text-muted) 40%, transparent); }
.node.on { border-color: color-mix(in srgb, var(--ds-accent) 70%, transparent); background: color-mix(in srgb, var(--ds-accent) 10%, var(--ds-bg-panel)); }
.grp { padding: .25rem .55rem; border-radius: 999px; border-color: color-mix(in srgb, var(--ds-text-muted) 45%, transparent); background: color-mix(in srgb, var(--ds-text-muted) 14%, var(--ds-bg-panel)); font-weight: 600; }
.gl { display: grid; place-items: center; width: 1.1rem; height: 1.1rem; border-radius: .3rem; font-size: 10.5px; color: var(--ds-text-muted); background: color-mix(in srgb, var(--ds-text-muted) 16%, transparent); }
.tile { display: grid; place-items: center; width: 1.1rem; height: 1.1rem; border-radius: .3rem; font-size: 10px; color: var(--ink); background: linear-gradient(135deg, var(--a), var(--b)); }
.blk { border-color: color-mix(in srgb, var(--a) 30%, transparent); background: linear-gradient(100deg, color-mix(in srgb, var(--a) 16%, var(--ds-bg-panel)), var(--ds-bg-panel) 70%); }
.blk .l { font-weight: 600; color: var(--a); }
.blk.on { border-color: var(--ds-accent); box-shadow: 0 0 0 1px var(--ds-accent); }

/* status line */
.status { position: relative; display: flex; align-items: center; gap: .45rem; min-height: 2.6rem; padding: .35rem .75rem; border-top: 1px solid var(--ds-border); font-size: 12.5px; color: var(--ds-text-muted); overflow: hidden; isolation: isolate; }
.status svg.ti { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--ds-accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.status .tx { flex: 1; min-width: 0; }
.status b { color: var(--ds-text); font-weight: 600; }
.status .route { color: var(--ds-text); }
.open { position: relative; flex: none; overflow: hidden; height: 1.75rem; padding: 0 .7rem; border-radius: var(--ds-radius); border: 1px solid var(--ds-border); background: rgba(255,255,255,.04); font-size: 12px; }
.open:hover { border-color: var(--ds-accent); }

/* ---------- A: light edge (glass glint sweeps along the top edge, button gets one sheen) ---------- */
.va .status::before { content: ""; position: absolute; inset: -1px 0 auto; height: 2px; background: linear-gradient(90deg, transparent, var(--ds-accent) 45%, #fff 50%, var(--ds-accent) 55%, transparent); transform: translateX(-100%); opacity: 0; z-index: 1; }
.va .status.go::before { animation: edge 900ms cubic-bezier(.4,0,.2,1) 1; }
.va .status::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--ds-accent) 9%, transparent), transparent 80%); opacity: 0; z-index: -1; }
.va .status.go::after { animation: wash 1400ms ease-out 1; }
.va .open::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); transform: translateX(-120%); }
.va .status.go .open::after { animation: sheen 900ms ease-out 450ms 1; }
@keyframes edge { 0% { transform: translateX(-100%); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }
@keyframes wash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sheen { to { transform: translateX(120%); } }
/* reduced motion: no sweep; the edge and the wash only fade in and out */
.rm.va .status.go::before { transform: none; animation: fadeline 1400ms ease-out 1; }
.rm.va .status.go .open::after { animation: none; }
.rm.va .status.go .open { animation: btnring 1400ms ease-out 1; }
@keyframes fadeline { 0% { opacity: 0; } 25% { opacity: .9; } 100% { opacity: 0; } }

/* ---------- B: breath (one soft accent pulse of the whole line, button ring fades out) ---------- */
.vb .status.go { animation: breath 1300ms ease-in-out 1; }
.vb .status.go .open { animation: btnring 1300ms ease-out 250ms 1; }
@keyframes breath { 0% { background: transparent; box-shadow: inset 0 1px 0 transparent; } 35% { background: color-mix(in srgb, var(--ds-accent) 12%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ds-accent) 70%, transparent); } 100% { background: transparent; box-shadow: inset 0 1px 0 transparent; } }
@keyframes btnring { 0% { border-color: var(--ds-border); box-shadow: 0 0 0 0 rgba(126,207,255,0); } 30% { border-color: var(--ds-accent); box-shadow: 0 0 0 3px rgba(126,207,255,.22); } 100% { border-color: var(--ds-border); box-shadow: 0 0 0 0 rgba(126,207,255,0); } }
/* reduced motion: same (color only, nothing moves) */

/* ---------- C: arrival (text glides up into place, an underline grows under the route, button text shimmers) ---------- */
.vc .status .route { background: linear-gradient(var(--ds-accent), var(--ds-accent)) left bottom / 0 1px no-repeat; padding-bottom: 1px; }
.vc .status.go .tx, .vc .status.go svg.ti { animation: rise 380ms cubic-bezier(.2,.7,.2,1) 1; }
.vc .status.go .route { animation: underline 1600ms ease-out 1; }
.vc .status.go .open { animation: shimmer 1100ms ease-out 300ms 1; background-image: linear-gradient(110deg, var(--ds-text) 40%, var(--ds-accent) 50%, var(--ds-text) 60%); background-size: 250% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes underline { 0% { background-size: 0 1px; background-position: left bottom; } 35% { background-size: 100% 1px; background-position: left bottom; } 75% { background-size: 100% 1px; background-position: right bottom; } 100% { background-size: 0 1px; background-position: right bottom; } }
@keyframes shimmer { 0% { color: transparent; background-position: 100% 0; } 99% { color: transparent; background-position: 0 0; } 100% { color: var(--ds-text); } }
/* reduced motion: no rise or shimmer; text and underline only fade in */
.rm.vc .status.go .tx, .rm.vc .status.go svg.ti { animation: fadein 400ms ease-out 1; }
.rm.vc .status.go .route { animation: none; background-size: 100% 1px; transition: background-size 0s; }
.rm.vc .status.go .open { animation: btnring 1300ms ease-out 1; background-image: none; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { .note-rm { display: inline; } }
</style>
</head>
<body>
<div class="mk" id="mk">
  <span><b>Vorschlag</b><span class="seg" id="seg"><button data-v="a" aria-pressed="true">A Lichtkante</button><button data-v="b" aria-pressed="false">B Atmen</button><button data-v="c" aria-pressed="false">C Ankommen</button></span></span>
  <label><input type="checkbox" id="rm"> Bewegung reduzieren</label>
  <span class="note" id="note"></span>
</div>
<div class="wrap">
  <div class="panel" id="panel">
    <p class="hint">Nur Ansicht. Einen Ast antippen, unten erscheint der Ort zum Bearbeiten.</p>
    <div class="tree" id="tree">
      <svg id="lines" aria-hidden="true"></svg>
      <div class="root" data-n="root">Newsletter</div>
      <div class="cols">
        <div class="col"><span class="node grp" data-n="head" data-p="root">Kopfzeile</span>
          <ul><li><button class="node" data-n="logo" data-p="head"><span class="gl">◎</span>Logo</button></li><li><button class="node" data-n="name" data-p="head"><span class="gl">A</span>Markenname</button></li></ul></div>
        <div class="col"><span class="node grp" data-n="body" data-p="root">Inhalt</span>
          <ul><li><button class="node blk" style="--a:#fb923c;--b:#ea580c;--ink:#0b1220" data-n="hero" data-p="body"><span class="tile">✨</span><span class="l">Hero</span></button></li><li><button class="node blk" style="--a:#60a5fa;--b:#1d4ed8;--ink:#fff" data-n="para" data-p="body"><span class="tile">Aa</span><span class="l">Absatz</span></button></li></ul></div>
        <div class="col"><span class="node grp" data-n="foot" data-p="root">Fußzeile</span>
          <ul><li><button class="node" data-n="imprint" data-p="foot"><span class="gl">§</span>Impressum</button></li><li><button class="node" data-n="social" data-p="foot"><span class="gl">@</span>Social Media</button></li></ul></div>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</div>
<script>
const ICON = {
  brand: ['M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.4 6.9 19.1l1-5.6-4.1-4 5.7-.8z'],
  legal: ['M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z', 'M9 12l2 2 4-4'],
  social: ['M3.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', 'M15.5 6a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', 'M15.5 18a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', 'M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6'],
  placed: ['M5 4h14a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z', 'M5 11h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z', 'M5 17h8a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1z'],
};
const WHERE = {
  logo: ['Logo', 'brand', 'Marke › 3 Logo', 'Öffnen'], name: ['Markenname', 'brand', 'Marke › 2 Markenname', 'Öffnen'],
  imprint: ['Impressum', 'legal', 'Legal › Links', 'Öffnen'], social: ['Social Media', 'social', 'Social Media', 'Öffnen'],
  hero: ['Hero', 'placed', 'Aktuelle Bausteine › Liste', 'Zur Liste'], para: ['Absatz', 'placed', 'Aktuelle Bausteine › Liste', 'Zur Liste'],
};
const NOTES = {
  a: 'A Lichtkante: Ein schmaler Lichtstreif läuft einmal über die obere Kante der Zeile, die Zeile hellt kurz auf, danach glänzt der Knopf einmal. Dauer knapp 1,5 s. Reduziert: Kante und Aufhellen blenden nur ein und aus, der Knopf bekommt einen leisen Ring.',
  b: 'B Atmen: Die ganze Zeile färbt sich einmal sanft im Akzentblau und wird wieder ruhig, der Knopf bekommt kurz einen weichen Ring. Nichts bewegt sich, darum gilt dieselbe Animation auch bei reduzierter Bewegung.',
  c: 'C Ankommen: Der neue Text gleitet 6 px von unten an seinen Platz, unter dem Ort wächst eine feine Linie von links, der Knopftext schimmert einmal. Reduziert: Text blendet nur ein, die Linie steht sofort, der Knopf bekommt einen leisen Ring.',
};
const $ = (id) => document.getElementById(id);
let v = 'a', sel = null;
function setClasses() { $('panel').className = 'panel v' + v + ($('rm').checked ? ' rm' : ''); $('note').textContent = NOTES[v]; }
function show(n) {
  sel = n; document.querySelectorAll('.node').forEach((x) => x.classList.toggle('on', x.dataset.n === n));
  const w = WHERE[n]; const st = $('status');
  st.innerHTML = `<svg class="ti" viewBox="0 0 24 24" aria-hidden="true">${ICON[w[1]].map((d) => `<path d="${d}"/>`).join('')}</svg><span class="tx"><b>${w[0]}</b> bearbeitest du in <span class="route">${w[2]}</span></span><button class="open">${w[3]}</button>`;
  st.classList.remove('go'); void st.offsetWidth; st.classList.add('go');
}
function draw() {
  const tree = $('tree'), box = tree.getBoundingClientRect(); const out = [];
  tree.querySelectorAll('[data-p]').forEach((el) => {
    const p = tree.querySelector(`[data-n="${el.dataset.p}"]`).getBoundingClientRect(), c = el.getBoundingClientRect();
    if (el.dataset.p === 'root') { const x0 = p.left + p.width / 2 - box.left, y0 = p.bottom - box.top, x1 = c.left + c.width / 2 - box.left, y1 = c.top - box.top, ym = (y0 + y1) / 2; out.push(`<path d="M${x0} ${y0} V${ym} H${x1} V${y1}" stroke-width="2.4"/>`); }
    else { const x0 = p.left + 10 - box.left, y0 = p.bottom - box.top, cy = c.top + c.height / 2 - box.top, r = 6; out.push(`<path d="M${x0} ${y0} V${cy - r} Q${x0} ${cy} ${x0 + r} ${cy} H${c.left - box.left}" stroke-width="1.6"/>`); }
  });
  $('lines').innerHTML = out.join('');
}
$('seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; v = b.dataset.v; document.querySelectorAll('#seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); setClasses(); show(sel || 'logo'); });
$('rm').addEventListener('change', () => { setClasses(); show(sel || 'logo'); });
$('tree').addEventListener('click', (e) => { const n = e.target.closest('button.node'); if (n) show(n.dataset.n); });
try { $('rm').checked = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }
setClasses(); draw(); window.addEventListener('resize', draw);
$('status').innerHTML = '<span class="tx">Zeigen oder Antippen eines Asts sagt, wo er bearbeitet wird.</span>';
</script>
</body>
</html>
